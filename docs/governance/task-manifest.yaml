# MeshyForge Task Ledger — source of truth
#
# Governed by ADR-0005 (docs/adr/0005-agentic-delivery-governance.md).
# This file is the durable, git-tracked record of planned/in-flight/done
# work that any agent, on any machine, can read cold and correctly resume.
# It is projected into a queryable SQLite cache at .claude/state/task_ledger.db
# via `node scripts/governance/sync_task_ledger.mjs` — that DB is gitignored
# and fully rebuildable from this file; if the two ever disagree, THIS FILE
# WINS. Never hand-edit the DB.
#
# Schema per task entry:
#   id            — TASK-NNNN, sequential, zero-padded 4 digits, never reused
#   title         — short imperative summary
#   status        — pending | in_progress | blocked | completed | abandoned
#   risk_level    — 0-4. Blast radius if this goes wrong (per adr-log's
#                   needs-an-ADR test and the risk table in
#                   meshyforge-agent-orchestrator's SKILL.md Step 3).
#   capability_tier — T0 | T1 | T2 | T3 (see model-routing.md). What kind of
#                   reasoning the work needs. NOT derived from risk_level —
#                   these are independent axes (a T2 audit can surface a
#                   risk_level-3 finding without the audit itself needing
#                   T3 judgment; a risk_level-3 fix can be mechanical once
#                   an ADR has already decided the approach). Do not assume
#                   a fixed formula between the two columns.
#   owner         — agent/session id, or "unassigned"
#   created       — ISO 8601 date
#   updated       — ISO 8601 date
#   blocked_by    — list of task ids, or []
#   evidence_gate — what must be true before this is considered done
#                   (tests, phase-gate-check verdict, ADR acceptance, etc.)
#   adr_refs      — list of ADR ids this task implements or was spawned by
#   notes         — free text; append, don't overwrite, so history survives

