  - id: TASK-0007
    title: "Implement the viewport-control registry per the accepted ADR from TASK-0005"
    status: completed
    risk_level: 1
    capability_tier: T1
    owner: claude-sonnet-5
    created: "2026-09-04"
    updated: "2026-09-05"
    blocked_by: []
    evidence_gate: "Matches the accepted ADR's chosen option; AssetPreview3D control behavior covered by component tests"
    adr_refs: ["ADR-0006"]
    notes:
      - "2026-09-04: Cannot start until TASK-0005's ADR is accepted — implementation shape depends entirely on which option is chosen."
      - "2026-09-05: Implemented per ADR-0006 Option A. New src/hooks/useViewportControls.ts owns scale state (clamped [0.5, 2], step 0.25), a controlsRef for the OrbitControls instance, and resetView() (calls controlsRef.current?.reset() then resets scale to 1) — 6 new hook tests cover clamping, zoom in/out bounds, and reset-before-ref-registered safety. AssetPreview3D.tsx now consumes the hook instead of hardcoding controls: scale is applied via a CSS transform on the canvas wrapper div (not a Three.js/Bounds re-fit, which would fight a manual zoom — this was a deliberate design choice during implementation, not in the original ADR text), OrbitControls gets a callback ref (RefObject<OrbitControlsLike> is structurally incompatible with drei's RefAttributes<OrbitControlsImpl> — a callback ref sidesteps the TS mismatch cleanly), and a small control panel (Zoom out / Reset / Zoom in) is overlaid absolutely so it isn't itself scaled. 3 new component tests cover the controls rendering, zoom-out disabling at the floor, and reset re-enabling them. `npx vitest run` — 57/57 files, 366/366 tests passed (full suite, not just the changed files). `npx biome check` and `npx tsc --noEmit` clean on all 4 changed/new files."
      - "2026-09-05: ADVERSARIAL PASS (requested explicitly, re-checked against ADR-0006's north star and VP-13/VP-14). REAL BUG FOUND AND FIXED: resetView() was calling `controlsRef.current?.reset()` on drei's OrbitControls, which only replays the camera pose OrbitControls captured at its own construction time — since OrbitControls mounts synchronously while the GLB is still loading under Suspense, that snapshot is the raw declared camera prop ([3,2,5]/fov 45), captured *before* `<Bounds fit>` ever runs its auto-fit for the actual loaded model. So 'Reset View' would have silently ignored the model's real size/framing and snapped to an arbitrary, model-agnostic pose — potentially clipped, tiny, or off-center depending on the asset — directly contradicting CAM-05's 'automatically frames the model' behavior and the feature's own stated purpose. FIX: drei's `Bounds` exposes its imperative refit API only via `useBounds()` context (verified by reading node_modules/@react-three/drei/core/Bounds.js directly — its `reset()`/`fit()` recompute the goal camera pose from the box captured at the last `refresh()` call, i.e. from the live, loaded model, and — because our OrbitControls already has `makeDefault` set — properly syncs the controls' target via `controls.target.copy(...)`+`controls.update()` internally). Added a `BoundsApiCapture` child component (renders null, just bridges `useBounds()` out via a ref) placed inside `<Bounds>`; `useViewportControls`'s `resetView` now calls `boundsApiRef.current.refresh().fit()` as the primary path, falling back to the old `controlsRef.current?.reset()` only if no Bounds API was ever captured. SCOPE CUT, documented not hidden: this restores correct *framing* (distance/centering re-derived from the current model) but re-fits along the camera's *current* post-orbit direction rather than replaying the exact original mount-time angle — i.e. 'Reset' means 'refit to a good view', not 'undo every rotation', matching how CAM-05 already describes auto-fit. Judged sufficient for this pass; flagged to the user as an explicit open question rather than silently expanding scope to full pose-capture-and-restore."
      - "2026-09-05: SECOND FINDING, NOT FIXED — flagged as an open design question rather than unilaterally reworked. The scale-preview control (Zoom in/out buttons) is implemented as a CSS `transform: scale()` on the canvas wrapper div, which is a *different, disconnected* zoom mechanism from the real camera-dolly zoom already available via OrbitControls' scroll-wheel/pinch `enableZoom` (clamped distance 2–15). Consequences: (1) quality — scaling up is a rasterized-canvas upscale (blurry), unlike a real dolly which re-renders at full sharpness; (2) two independent, unsynchronized 'zoom' values can coexist confusingly (a user already at max real dolly-zoom can still press '+' and get a blurry over-zoom on top of it); (3) arguably doesn't clear the 'greatly improve preview capabilities' bar since it's a lower-fidelity duplicate of an existing capability rather than a new one. A more north-star-aligned fix would drive the SAME OrbitControls dolly distance from the zoom buttons (e.g. move the camera along the target-to-camera vector and call `controls.update()`, which self-clamps to minDistance/maxDistance) instead of a CSS transform — unifying state with scroll-wheel zoom and avoiding the blur. NOT implemented in this pass: it's a real rework of the zoom mechanism (not a bug fix), ADR-0006's Decision text did not specify an implementation mechanism for 'scale-preview' at all, and a rendering-approach change with user-facing quality tradeoffs is exactly the kind of thing that should be confirmed with the user first rather than silently redone twice in one session."
      - "2026-09-05: THIRD FINDING, FIXED (small, low-risk): at scale<1 the CSS-scaled canvas wrapper shrinks inside its `overflow-hidden` parent, and the parent had no background color — so shrinking revealed whatever sits behind the viewport (likely the app's lighter background) instead of the dark viewer aesthetic the Canvas itself uses (`#171717`). Fixed by adding the same `bg-[#171717]` to the outer wrapper div so there's no visible seam/gap at any scale. Covered indirectly by existing rendering tests (no new test added for a pure CSS background fix, per the project's existing pattern of not testing static class names)."

  - id: TASK-0008
