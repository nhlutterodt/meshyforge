      - "2026-11-23: ORDERING. Land after TASK-0045, so every rule ID in the new text points at a command that actually exists. A DEP rule naming a check nobody has written is exactly how DEP-06 got here."
      - "2026-11-23: HANDOFF NOTE. adr-log never edits planning docs itself; ADR-0017's Consequences section lists this edit as the doc-sync payload. Doing it by hand is acceptable because the edit is one table section and the ADR text is already exact."
      - "2026-11-23: EXECUTED, AFTER THE GATE WAS CORRECTED - it was unachievable as written. The original gate demanded that DEP-11 and DEP-12 have a 'Check column naming a command that exists'. GREB §13.1's columns are Rule ID | Rule | Rationale | Source: there IS no Check column. The gate was written before the table was read, conflating it with the baseline's own §4 table (which has a Check column because this programme authored it that way). Resolved by following DEP-08's precedent instead - 'Run `npx depcheck` ... and `cargo udeps`' - i.e. the command goes in the Rule text."
      - "2026-11-23: SECOND CORRECTION - THE ALLOWLIST IS NOT RESTATED IN PROSE. The plan said GREB should list the allowlisted identifiers. Two reasons it does not: the list is now THIRTEEN identifiers (six were added by TASK-0045/0047), and copying it into GREB would create a second source of truth for deny.toml - the exact drift class that made LM-01 derive its identifier instead of storing it. DEP-06 now states the policy, points at deny.toml, and names the commands."
      - "2026-11-23: FINDING - DEP-06 WAS NOT THE ONLY UNENFORCED RULE. Of the ten DEP rules in §13.1, NINE have no check at all. Three are cheaply checkable today: DEP-03 (locks committed) via git ls-files, DEP-10 (three pinned) via one regex, and DEP-01/DEP-02 (caret ranges) by parsing both manifests. Filed as TASK-0048 rather than folded in here - adding a Check column to all eleven rows is a governance decision that would advertise nine broken rules, not a text edit."
      - "2026-11-23: VERIFIED. GREB §13.1 now carries DEP-11 and DEP-12 in the same 4-column shape, each citing ADR-0017 in Source. Both commands named by the rewritten rules exit 0 (cargo deny licenses ok; npm licences OK: 420 packages). The capture UI is renumbered to TASK-0049 because TASK-0048 was taken by the enforcement-gap finding."

  - id: TASK-0047
    title: "Build the SPDX-aware npm licence evaluator and resolve webgl-constants@1.1.1's undeclared licence, so DEP-06's npm half has a gate"
    status: completed
    risk_level: 1
    capability_tier: T1
    owner: cline-session-2026-11-23
    created: "2026-11-23"
    updated: "2026-11-23"
    blocked_by: []
    evidence_gate: "A script reads `license-checker --json` and EVALUATES SPDX expressions (never `--onlyAllow`), enumerating ALL offenders in one run rather than stopping at the first; a fixture table proves 'MIT OR Apache-2.0' passes, a bare MPL-2.0 fails, and an undeclared licence fails; webgl-constants@1.1.1 has a recorded disposition (verified upstream licence, or an explicit exception with its reason) so the gate exits 0; and the evaluation is wired into ci.yml"
    adr_refs: ["ADR-0017"]
    notes:
      - "2026-11-23: SPLIT FROM TASK-0045 BECAUSE IT CANNOT START GREEN. The Rust half passes today; the npm half does not, because webgl-constants@1.1.1 declares no licence field anywhere in its published artefact and DEP-11 makes that a failure. Mixing them would ship a red gate."
      - "2026-11-23: license-checker --onlyAllow IS NOT USABLE, proven not assumed. TASK-0038 recorded that it is a string comparison and fail-fast: two runs over the same tree stopped on different packages, so it can never enumerate offenders. concept-15 s2.3 - 'a fail-fast check is not a gate'. The evaluator must parse `--json` and apply the SAME SPDX-disjunct rule as the Rust side, or the two halves of DEP-06 would mean different things."
      - "2026-11-23: webgl-constants IS A REAL UNKNOWN, NOT A FORMALITY. Its status is 'unknown', not 'MIT', until its upstream repository is checked. Resolving it by declaring it MIT would be inventing a fact; the disposition must be either a verified licence or an explicit, reasoned exception."
      - "2026-11-23: 435 production npm packages, not 434. The earlier hand-sum in concept-12 was corrected during TASK-0041. Use the generated count in THIRD_PARTY_NOTICES.md as the source of truth rather than re-counting by hand."
      - "2026-11-23: EXECUTED. scripts/lib/spdx.mjs (real grammar) + scripts/check-npm-licenses.mjs + npm run licenses:npm + the npm step in the license-check CI job. The allowlist is READ FROM deny.toml, so the Rust and npm halves of DEP-06 cannot drift apart by construction."
      - "2026-11-23: THE EVALUATOR NEEDED A REAL PARSER, NOT THE NOTICES SPLITTER. generate-third-party-notices.mjs has expandExpression, which splits flat on OR/AND - correct for GROUPING appendix sections, wrong for SATISFACTION: 'MIT AND GPL-3.0' would be called satisfied on the strength of MIT alone. scripts/lib/spdx.mjs implements or/and/atom with parentheses and WITH, and treats an unparseable expression as a FAILURE rather than a pass."
      - "2026-11-23: IT REPORTED 8 VIOLATIONS, ALL REAL, EACH NEEDING A DIFFERENT DISPOSITION (see ADR-0017 amendment 2). Two were not licence questions at all: 'UNLICENSED' was OUR OWN private package (meshyforge, skipped by reading package.json name@version), and 'MIT*' was license-checker's INFERENCE for webgl-constants - an asterisked identifier is not a declaration, so DEP-11 applies and it needs a recorded exception."
      - "2026-11-23: THE PREDICTION WAS RIGHT BUT FOR A NEW REASON. TASK-0045's notes predicted the npm half 'cannot start green' because of webgl-constants. It actually failed for SEVEN packages beyond that: the npm ecosystem uses a different licence vocabulary from Rust (0BSD, BlueOak-1.0.0, Python-2.0, OFL-1.1, CC-BY-4.0). DEP-06 had only ever been reasoned about as a Rust rule. Five identifiers added with per-package comments; the two attribution licences are discharged by DEP-12's notice bundle."
      - "2026-11-23: FIXTURES RUN ON EVERY INVOCATION, not in a separate suite. vitest only includes src/**/*.test.{ts,tsx}, so a test under scripts/ would silently never run in CI. Instead the checker asserts a 9-row fixture table before it evaluates anything and exits 2 if the parser is broken - a gate whose parser is broken is worse than no gate, because it reports compliance it never checked. The discriminator row is 'MIT AND GPL-3.0' -> false."
      - "2026-11-23: VERIFIED. npm run licenses:npm -> 'npm licences OK: 420 production packages checked against deny.toml', exit 0, with the webgl-constants exception printed every run. cargo deny still exits 0 with the widened list. biome clean at 155 files. (420 vs the 435 in the notices bundle: license-checker --production counts installed production packages; the bundle counts the resolved tree. Both are honest counts of different sets.)"
      - "2026-11-23: ONE DECISION TAKEN UNDER THE AUTONOMY MANDATE, flagged here so it is reversible. Adding OFL-1.1 and CC-BY-4.0 to the SHARED allowlist also widens the Rust gate slightly. The alternative was a second npm-only list, which reintroduces exactly the drift this task exists to prevent. Any single identifier can be removed and the reason re-litigated."

  - id: TASK-0048
    title: "Enforce the four cheaply-checkable DEP rules that have no check (DEP-01/02 caret ranges, DEP-03 locks committed, DEP-10 three pinned) — nine of the twelve DEP rules are currently unenforced"
    status: completed
    risk_level: 1
    capability_tier: T1
    owner: cline-session-2026-11-23
    created: "2026-11-23"
    updated: "2026-11-23"
    blocked_by: []
    evidence_gate: "scripts/check-dependency-rules.mjs checks DEP-01 and DEP-02 (caret ranges in package.json and src-tauri/Cargo.toml, with the DEP-10 exception honoured), DEP-03 (both lock files tracked per git ls-files), and DEP-10 (three pinned to an exact version); each rule reports its own verdict naming the offending declaration rather than failing fast; an eight-fixture self-test runs on EVERY invocation and proves each rule fires when violated and stays quiet when it should; and the check runs in its own ci.yml job so a licence failure and a version-range failure stay distinguishable"
    adr_refs: []
    notes:
      - "2026-11-23: FOUND WHILE EXECUTING TASK-0046, by reading §13.1 properly instead of only the DEP-06 row. The table has TEN rules and, before TASK-0045/0047, NONE of them had a check. DEP-06 is now enforced both ways. Of the remainder, five are not mechanically checkable (DEP-04 PR justification, DEP-05 download counts need network, DEP-07 monthly review, DEP-08 periodic depcheck, DEP-09 CVE lookups), but FOUR are trivial and currently unenforced."
      - "2026-11-23: THE FOUR, WITH THE COST OF EACH. DEP-03 (locks committed) is `git ls-files --error-unmatch package-lock.json src-tauri/Cargo.lock`. DEP-10 (three pinned) is one regex over package.json. DEP-01/DEP-02 (caret ranges) is parsing both manifests and rejecting a bare or exact version - with DEP-10 carved out, since `three` is a deliberate exact pin and that is exactly the kind of interaction a naive regex would get wrong."
      - "2026-11-23: WHY THIS IS NOT PART OF TASK-0046. Adding a Check column to all eleven DEP rows would be the more honest long-term shape, but it would immediately advertise nine broken rules - that is a governance decision about how the table reports itself, not a text edit inside a docs task. Filed separately so the decision is visible rather than smuggled in."
      - "2026-11-23: DESIGN CONSTRAINT, learned from TASK-0045/0047. The script must ENUMERATE all violations in one run, not fail fast - a fail-fast check cannot be a gate (concept-15 s2.3, and the reason license-checker --onlyAllow was rejected). Each rule should report independently so one violation does not hide the next."
      - "2026-11-23: SEQUENCING. Independent of TASK-0049 (capture UI) and TASK-0040; can be done at any point. Small: one script plus one CI job, no product code touched."
      - "2026-11-23: EXECUTED. scripts/check-dependency-rules.mjs + `npm run deps:check` + a separate `dependency-rules` CI job. GREB DEP-01/02/03/10 now each name that command, following DEP-06's precedent (the command lives in the Rule text because the table has no Check column)."
      - "2026-11-23: THE GATE WAS RED ON ARRIVAL, CAUGHT BY RECON RATHER THAN BY THE BUILD - the TASK-0045 lesson applied before the fact. package.json had `three: \\\"^0.170.0\\\"` while DEP-10 requires an exact `\\\"0.170.0\\\"`. Pinning it changed NOTHING else: package-lock already resolved 0.170.0, `npm install --package-lock-only` left the resolved version untouched, and notices:check stayed green. Note DEP-10's TEXT and its RATIONALE also disagree - a caret on 0.x already forbids a minor bump - but fixing the manifest was cheaper than amending a rule, and DEP-01's exception line already anticipates an exact `three`."
      - "2026-11-23: AN UNPARSEABLE LINE IS A FINDING, NOT A SKIP. The Cargo reader handles `name = \\\"ver\\\"` and single-line `name = { version = ..., features = [...] }`; a table that continues onto following lines is REPORTED as a DEP-02 finding. A gate must never pass on the strength of what it could not parse. `path`/`git` dependencies are version-less and out of DEP-02's scope, so they are skipped by rule rather than passing by accident."
      - "2026-11-23: EIGHT FIXTURES RUN ON EVERY INVOCATION, including the two that must stay QUIET: `three` exempt from the caret rule, and a bare Cargo `\\\"2\\\"` (a caret equivalent). A broken parser exits 2 rather than reporting a verdict - the same discipline as the npm licence evaluator."
      - "2026-11-23: ANTI-VACUOUS GUARD. Refuses to report PASS if fewer than 10 dependencies were examined per manifest. Actual: 45 npm + 24 Cargo. A parser that matched nothing would otherwise look green."
      - "2026-11-23: VERIFIED. npm run deps:check - all four PASS (DEP-01 45 examined, DEP-02 24, DEP-03 2, DEP-10 1). biome clean at 157 files. DEP-05 (download counts, needs network), DEP-04/07/08/09 (judgement or periodic) remain uncheckable and are noted as such rather than pretended."

  - id: TASK-0049
    title: "Capture the rights predicates: an update_asset_rights command (ADR-0022) plus a per-asset editor, so the record added by TASK-0040 can actually be populated"
    status: completed
    risk_level: 2
    capability_tier: T2
    owner: cline-session-2026-11-23
