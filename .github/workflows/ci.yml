name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Tracked Secret Scan ─────────────────────────────────
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject tracked Meshy API keys
        shell: bash
        run: |
          matches="$(git grep -IlE 'msy_[A-Za-z0-9_-]{20,}' -- . ':(exclude)Meshy_Documentation/**' || true)"
          if [[ -n "$matches" ]]; then
            echo "Potential Meshy API key found in tracked file(s):"
            echo "$matches"
            exit 1
          fi

  # ─── Third-Party Notices Drift Gate ──────────────────────
  # THIRD_PARTY_NOTICES.md is a generated legal artifact. If a dependency is
  # added, bumped, or removed without regenerating it, the shipped notices stop
  # describing the binary. This fails the PR instead of letting the drift ship.
  # Deliberately here and not in audit.yml: that workflow is weekly-cron only and
  # every job is continue-on-error, so it can never gate a pull request.
  notices-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      # cargo metadata needs the Rust toolchain and the registry index, but no build.
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Verify THIRD_PARTY_NOTICES.md is current
        run: npm run notices:check

  # ─── Dependency Licence Gate ─────────────────────────────
  # DEP-06 as an SPDX-expression policy (ADR-0017): compliant when at least one
  # disjunct of the declared expression is allowlisted, so `MIT OR Apache-2.0`
  # passes while a bare MPL-2.0 fails unless the crate is one of the five named
  # tauri transitives. This is the check DEP-06 never had — before TASK-0045
  # there was no deny.toml and no licence job anywhere in this repo, which is
  # how the rule came to be both unenforced and unsatisfiable.
  # --exclude-dev keeps the gate on what actually ships.
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Version pinned to the binary the policy was verified against locally.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.0
      - name: Check dependency licences against DEP-06
        run: cargo deny --manifest-path src-tauri/Cargo.toml --exclude-dev check licenses
      # The npm half of the same policy. Same allowlist file, different graph:
      # the npm ecosystem supplies identifiers the Rust graph never uses.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Check npm licences against DEP-06
        run: npm run licenses:npm

  # ─── Dependency Rule Gate ────────────────────────────────
  # DEP-01/02 (caret ranges), DEP-03 (lockfiles committed), DEP-10 (`three`
  # pinned). Nine of the twelve DEP rules had no check at all before
  # TASK-0048; these four are the mechanically checkable ones. A separate job
  # from license-check on purpose: a version-range failure and a licence
  # failure must stay distinguishable in the checks list.
  dependency-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # DEP-03 reads `git ls-files`, so no install and no lockfile are needed.
      - name: Check DEP-01, DEP-02, DEP-03 and DEP-10
        run: npm run deps:check

  # ─── Root Layout Drift Gate ──────────────────────────────
  # GREB §4.1 says the root "must contain exactly the following files and
  # directories". By the time TASK-0044 was filed it had drifted by ten tracked
  # entries, because nothing checked it. This fails a PR that adds a tracked
  # top-level entry without documenting it (and vice versa).
  layout-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify GREB §4.1 matches the tracked root
        run: node scripts/check-root-layout.mjs

  # ─── Frontend Lint + Type Check ──────────────────────────
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx biome check src/ scripts/
      - run: npx tsc --noEmit
      - run: npm run test:guardrails

  # ─── Frontend Tests ──────────────────────────────────────
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  # ─── Rust Checks ────────────────────────────────────────
  rust-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # ─── Build (smoke test) ──────────────────────────────────
  build-smoke:
    needs: [security-checks, frontend-checks, frontend-tests, rust-checks]
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev
      - run: npm ci
      - run: npm run tauri build -- --target ${{ matrix.target }}