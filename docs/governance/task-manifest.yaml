  - id: TASK-0012
    title: "Rework scale-preview to drive OrbitControls' real camera dolly instead of a CSS transform"
    status: completed
    risk_level: 1
    capability_tier: T1
    owner: claude-sonnet-5
    created: "2026-09-05"
    updated: "2026-09-05"
    blocked_by: []
    evidence_gate: "Zoom in/out buttons move the camera along the target-to-camera vector and call controls.update() (self-clamping to minDistance/maxDistance 2-15) instead of applying a CSS transform; a single zoom state (camera distance) is shared with scroll-wheel/pinch zoom; component tests assert camera distance changes, not a CSS scale style"
    adr_refs: ["ADR-0006"]
    notes:
      - "2026-09-05: Found during an adversarial pass on TASK-0007's implementation (requested explicitly, not a routine check). Current scale-preview is a CSS `transform: scale()` on the canvas wrapper — disconnected from, and lower-fidelity than, the real dolly-zoom already available via OrbitControls' scroll-wheel/pinch (enableZoom, distance clamped 2-15). Blurry upscale on zoom-in, two unsynchronized zoom values can coexist confusingly, and it arguably doesn't meet the 'greatly improve preview capabilities' bar since it duplicates an existing capability at lower quality rather than adding a new one. Deliberately NOT fixed in the same pass as the reset-view bug (TASK-0007's notes) — this is a rework of the zoom mechanism's rendering approach, not a bug fix, ADR-0006 never specified an implementation mechanism for scale-preview, and a user-facing quality tradeoff of this kind should be confirmed before redoing it, per this session's own pattern of pausing before architecture-adjacent choices."
      - "2026-09-05: IMPLEMENTED on explicit user instruction ('execute it'). src/hooks/useViewportControls.ts's scale state (React-only, [0.5,2]) replaced with a `distance` state (number | null, null = unknown/not-yet-dollied) plus a `dolly(factor)` helper that reads the real OrbitControls instance's `object.position`/`target` (plain {x,y,z,set()} vector math, no `three` import needed in the hook), computes the target-to-camera distance, clamps to MIN_DISTANCE/MAX_DISTANCE (2/15, now a single source of truth also passed to the OrbitControls component's minDistance/maxDistance props instead of hardcoding 2/15 twice), repositions the camera via `position.set(...)`, and calls `controls.update()` — verified via reading node_modules/@react-three/drei/core/OrbitControls.js directly that `update()` firing a real 'change' event calls `invalidate()` internally, so the dolly repaints correctly even under the Canvas's `frameloop=\"demand\"`. AssetPreview3D.tsx's CSS `transform: scale()` wrapper div removed entirely (one fewer DOM layer); zoom in/out buttons now disable based on the real `distance` vs `minDistance`/`maxDistance` instead of a fake CSS scale range."
      - "2026-09-05: REAL BUG FOUND DURING THIS REWORK (test-driven, not routine) — the OrbitControls ref was wired via an inline arrow function (`ref={(instance) => { controlsRef.current = instance; }}`), which gets a new function identity on every render. This only became visibly wrong when writing a test double using `forwardRef`+`useImperativeHandle`: React's actual useImperativeHandle implementation appends the `ref` argument itself to the effect's dependency array internally, so a ref with a new identity every render forces `create()` to re-run every render, silently discarding the mutated handle and resetting test state each click — which would have made the disabled-at-clamp tests falsely appear to hang at the initial distance forever. This specific failure mode does not reproduce against the REAL drei OrbitControls in production (its underlying three-stdlib instance is memoized via `useMemo` and persists regardless of ref-callback churn — only a harmless detach(null)/reattach(same instance) happens on every render), so this was not a production bug, but the underlying inline-callback anti-pattern was real and worth fixing regardless (avoids unnecessary detach/reattach churn on every state update). FIX: hook now returns a stable `setControlsRef` callback (via `useCallback` with an empty dep array, closing over the stable `controlsRef` object) instead of requiring the component to construct its own inline callback — single stable identity for the lifetime of the component."
      - "2026-09-05: Tests rewritten for the new API: 10 hook tests (src/hooks/useViewportControls.test.tsx) use a hand-built fake Vector3 (`{x,y,z,set()}`) to verify dolly math, both-direction clamping to minDistance/maxDistance, zero-distance no-op safety, and reset-view's Bounds-API-preferred / OrbitControls.reset()-fallback behavior (unchanged from the prior pass). 11 component tests (AssetPreview3D.test.tsx) mock OrbitControls as a real `forwardRef`+`useImperativeHandle` component exposing a fake controls instance, asserting: the zoom buttons drive `controls.update()` (not a CSS style attribute), zoom-out disables at maxDistance (15), zoom-in disables at minDistance (2), and reset re-enables both. `npx vitest run` — 57/57 files, 373/373 tests passed (full suite). `npx biome check` and `npx tsc --noEmit` clean on all 4 changed files."

