    adr_refs: ["ADR-0006"]
    notes:
      - "2026-09-04: Routed to adr-log, not drafted here. Trips needs-an-ADR criterion 1 (new module-boundary convention: a controls registry that doesn't exist yet) and criterion 6 (foundational UI architecture, expensive to redo once panels depend on it). Recommend framing the options as: (A) a typed control-registry/hook (e.g. useViewportControls) that AssetPreview3D and future viewers register against, extensible without touching the component itself; (B) props-drilled control flags on AssetPreview3D, extended ad hoc per new control (cheaper now, the exact 'heavy refactor per addition' pattern the request explicitly wants to avoid); (C) defer, ship only what exists today. NOT drafting the ADR file itself here — needs your confirmation on direction first, per the gate."
