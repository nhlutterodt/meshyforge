  - id: TASK-0004
    title: "Ground preview-control feature request: what exists today, what Meshy's API actually offers, how the provider trait fits"
    status: completed
    risk_level: 0
    capability_tier: T2
    owner: claude-sonnet-5
    created: "2026-09-04"
    updated: "2026-09-04"
    blocked_by: []
    evidence_gate: "Findings cite concrete file:line evidence, not assumptions"
    adr_refs: []
    notes:
      - "2026-09-04: src/components/gallery/AssetPreview3D.tsx (114 lines) is the only viewer component — single OrbitControls (pan/zoom/rotate, minDistance 2/maxDistance 15) + Bounds/Center auto-frame on mount/resize. No reset-view control, no scale control, no controls registry/abstraction of any kind. Caller (AssetDetail.tsx) passes no control props."
      - "2026-09-04: Meshy's mesh-manipulation endpoints (Meshy_Documentation/13-15) are all async, task-based, credit-consuming, and PERMANENT (they produce a new model version): Resize (real-world dimension rescale), Remesh (retopology), Retexture (material reskin), Convert (format only). None of these are a 'scale the viewport' operation — that's a local, free, instant, non-destructive render transform with no API involvement at all. Conflating the two would be a real design mistake: one is 'change the asset', the other is 'change how I'm looking at the asset'."
      - "2026-09-04: src-tauri/src/provider/mod.rs:29-83 TaskProvider trait (ADR-0004) is generic and task-type-driven (create_task/get_task/stream_task keyed by TaskType). Any REAL Meshy operation (Resize/Remesh/Retexture) fits this seam directly via new TaskType variants — no new abstraction needed. It has nothing to do with, and shouldn't be extended to cover, client-side viewport controls."

