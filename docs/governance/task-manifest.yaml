    evidence_gate: "ADR-0022 is accepted before any code is written (the command crosses the IPC boundary - adr-log criteria 1 and 3); a single update_asset_rights command takes the asset id plus three tri-state enums and a disclosure posture, with NO path or free-text argument; the CommandName union in src/lib/tauri.ts and its guardrail test are updated together; an IPC-11 harness entry pins the camelCase decode and the invalid-input envelope; unknown enum values are rejected rather than coerced; the editor renders NOASSERTION as 'not established' with its reason code and never falls back to 'owned'; and a fresh-context security review passes"
    adr_refs: []
    notes:
      - "2026-11-23: FILED BECAUSE OTHERWISE THE CONTROL IS INERT FOR A SECOND, DEEPER REASON. TASK-0040 adds the columns and the derivation, and Fact A defaults the tier to unknown - but there is no UI anywhere to RECORD a predicate, so every asset would keep NULL forever regardless of what the owner later decides about the plan tier. The absence of Fact A is a deferral; the absence of any capture path would be a permanent hole wearing a deferral's clothes. Zero hits for plan_tier/planTier across src/ and src-tauri/src/ before this task."
      - "2026-11-23: ADR-0022 IS REQUIRED, AND ITS STEP 5 GATE WAS ALREADY SATISFIED. Classification Contract; the alternatives were considered and rejected in the S3 plan - folding the write into update_notes would let a notes edit silently mutate a legal record, and a generic patch-asset command is a wider seam for the same benefit. The ADR is not yet written; adr_refs stays [] until it is, because the ledger validator checks that referenced ADRs exist as files."
      - "2026-11-23: THIS IS THE ONE DELIBERATE NEW SEAM IN THE PROGRAMME. ADR-0019 avoided widening the CommandName union for export by adding a parameter instead. Here a new command is unavoidable: nothing exists that writes these columns. The cost is the union, the guardrail test, and an IPC-11 harness entry - all three are in the evidence gate rather than discovered later."
      - "2026-11-23: DESIGN - TWO ARG SHAPES REJECTED. No path argument (nothing to contain, so SEC-B is not in play). No free-text argument (a note field would become a place to write a legal conclusion, which is exactly what the basis block in ADR-0019's record argues against). The predicates are enums, validated in Rust, because ADR-0018 moved the tri-state invariant out of SQL and into types."
      - "2026-11-23: UI PRECEDENT. The per-asset editor belongs in AssetDetail.tsx beside the notes/tags editors, not in a new screen; the delete confirmation added by TASK-0043 shows the dialog pattern already in use there. The list already carries the derived identifier and reason (TASK-0040 reads via SELECT *), so no new fetch is needed."
      - "2026-11-23: EXECUTED. ADR-0022 written (Contract, step-5 gate satisfied by the earlier classification/options/recommendation in the plan). Rust: Database::update_asset_rights (UPDATE ?2..?6, returns rows changed so 'no such asset' is distinguishable from 'written'), update_asset_rights command + inner with explicit whitelists (PLAN_TIERS, PREDICATE_VALUES), registered in lib.rs. Frontend: useUpdateAssetRights, RightsEditor, mounted in AssetDetail."
      - "2026-11-23: THE GUARDRAIL SHAPED THE UI, exactly as the adversarial pass predicted. RightsEditor needs to render 'not established' instead of the identifier, and the obvious implementation would have compared against the identifier string - which rights-derivation.guardrail.test.ts forbids anywhere under src/ outside meshy-types.ts. Resolution: rightsSummary() keys the caveat on rights.reason ('tier-unrecorded' -> 'plan tier not recorded') and echoes rights.identifier verbatim otherwise. The frontend still knows nothing about the derivation."
      - "2026-11-23: MY OWN TEST TRIPPED MY OWN GUARDRAIL, and the guardrail was right. The first RightsEditor test asserted `not.toContain(NOASSERTION)` and used a real identifier in a second case, so the guardrail flagged the TEST file. Fixed by asserting the property without naming the vocabulary: the summary must not equal rights.identifier, and a neutral sentinel ('IDENTIFIER-FROM-RUST') proves the component passes through whatever Rust sent instead of special-casing a known identifier. The replacement test is stronger - it now also catches hardcoding."
      - "2026-11-23: NO WAY TO WRITE NULL, ON PURPOSE. The selects offer free/paid/unknown and yes/no/unknown; an unrecorded field shows a disabled 'Not recorded' placeholder and the save button stays disabled until all four are chosen. There is deliberately no clear control: NULL means pre-baseline and re-creating it would be a lie about when the record was made. Recorded as a decision in ADR-0022's consequences."
      - "2026-11-23: recorded_at IS THE TRIPOD'S THIRD LEG. The command stamps chrono::now so a recorded 'unknown' is distinguishable from a pre-baseline NULL, which is the only thing keeping the two NOASSERTION states from collapsing. Tested directly."
      - "2026-11-23: THREE RIPPLE FAILURES, ALL INFORMATIVE. (1) invoke<T> takes Record<string, unknown>, so an interface arg is not assignable - fixed by passing an object literal, mirroring useExportAsset. (2)+(3) AssetDetail.test.tsx fixtures live in vi.hoisted, which runs BEFORE imports initialise: referencing the imported UNRECORDED_RIGHTS threw '__vi_import_5__ before initialization'. The fixture is now inlined with a comment explaining why. Both were invisible to tsc because that fixture is an untyped hoisted literal."
      - "2026-11-23: VERIFIED. cargo test 401 lib + 18 IPC = 419, 0 failed (4 new rights-command tests: record+derive, recorded-unknown tier, invalid enum refused without coercing, unknown asset refused; plus the IPC-11 harness entry pinning camelCase decode and INVALID_INPUT). vitest 68 files / 530 tests (4 new RightsEditor tests). tsc 0. biome clean at 160 files. notices:check, layout:check, deps:check and licenses:npm all green."

  - id: TASK-0050
    title: "Clear the recovery residual-risk register: N7/N10 (made reachable by the I1 closure), C2-a schema-diff depth, and the Low/Info items from the TASK-0025 audit"
    status: pending
    risk_level: 2
    capability_tier: T2
    owner: unassigned
    created: "2026-11-23"
    updated: "2026-11-23"
    blocked_by: []
    evidence_gate: "Each item is either fixed with a test that fails without the fix, or accepted with a recorded reason in security_threat_model.md §10; N7 and N10 are re-verified against the fact that production backups now exist (app_state.rs:47), because both were documented as unreachable only while I1 was open; and the register states, per item, whether it is fixed, accepted, or still open - no item silently disappears"
    adr_refs: ["ADR-0008", "ADR-0009"]
    notes:
      - "2026-11-23: FILED AFTER A FRESHNESS PASS OVERTURNED THE AUDIT'S REACHABILITY CLAIMS (R7). docs/audits/security-review-task-0025-recovery-2026-10-11.md lists these as 'documented, non-blocking', and two of them were explicitly justified by the absence of production backups."
      - "2026-11-23: THE FINDING THAT CREATED THIS TASK. Audit item I1 said 'backups are never created in production - create_backup callers are tests only', and N7/N10 were both annotated 'Needs backups (I1)'. I1 was CLOSED on 2026-10-11 by the pre-migration backup (app_state.rs:47 calls create_backup_from_file before migrations). Nobody re-reviewed N7/N10 afterwards, so closing a risk silently ACTIVATED two others: the recovery evidence screen now lists backups that restore_backup rejects (N7), and delete-DB-then-Restore now lands in a permanent recovery loop (N10). Creating risk as a side effect of fixing risk is precisely what this programme has been consistent about refusing to do quietly."
      - "2026-11-23: N8's caveat expired too ('Not reachable in 1.1.0, because there are no production backups'), but N8 was fixed anyway, so nothing is owed there. That is the difference an audit trail makes: the caveat could be checked rather than guessed."
      - "2026-11-23: C2-a IS THE DEEPEST ITEM AND SHOULD NOT BE FIXED IN A HURRY. matches_current_schema compares COLUMN NAMES only, so a crafted backup with matching names can still carry hostile triggers, weaker constraints, extra views or extra tables. It needs a same-user attacker (threat model residual risk 3), which is why it stayed Low, but a name-only comparison presented as schema validation is the kind of overclaim this repository keeps catching. Either deepen the comparison or relabel the function so its guarantee matches its name."
      - "2026-11-23: THE REST. L2 (no fsync before atomic renames), L6 (-journal sidecar not quarantined), L7 (symlinks/junctions not rejected under backups), L8 (lenient, unbounded request parsing - wants deny_unknown_fields plus a 1 KiB cap), I2 (oldest backup preselected, list labelled 'verified' without validation), I3 (legacy restore_latest_valid/recover lack staging and rollback; ms-timestamp quarantine IDs can collide; unique IDs wanted)."
      - "2026-11-23: ALSO CARRIED FROM TASK-0024's AUDIT DECISION. Only the CREATE call is audited: log_task_create is the sole production task_log writer, so response_status/response_body describe task creation and NOT the task lifecycle. Polling is not audited at all, and auditing it is a retention decision (a poll every few seconds per task), not a field addition. That scope limit belongs here so it is not mistaken for completeness."

