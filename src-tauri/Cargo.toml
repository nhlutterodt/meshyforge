[package]
name = "meshyforge"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[dependencies]
# ─── Tauri Core ──────────────────────────────────────────────
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"

# ─── HTTP Client ─────────────────────────────────────────────
# `rustls-tls` (= `rustls-tls-webpki-roots`) trusts only a bundled Mozilla
# CA list, not the OS certificate store — so it rejects any locally
# trusted root (antivirus HTTPS scanning like Norton, a corporate TLS-
# inspecting proxy, a VPN client) even though the system's own TLS stack
# (schannel/curl, the browser) trusts it fine. `rustls-tls-native-roots`
# keeps rustls as the TLS implementation (no OpenSSL added on Linux) but
# sources trusted roots from the OS store via `rustls-native-certs`,
# matching what curl/schannel already trust on this machine.
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls-native-roots"], default-features = false }

# ─── Serialization ────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ─── Database ─────────────────────────────────────────────────
rusqlite = { version = "0.31", features = ["bundled"] }

# ─── Secret Storage ───────────────────────────────────────────
# `keyring` has NO default backend — with no platform feature enabled it
# silently falls back to an in-memory, per-Entry mock with no persistence
# (see keyring-rs src/lib.rs and src/mock.rs), so every entry created
# after the one that stored a value starts empty. These features select
# the real OS credential store per platform: Windows Credential Manager,
# macOS/iOS Keychain, and the Secret Service (GNOME Keyring/KWallet) on
# Linux/BSD. `async-secret-service` (not `sync-secret-service`) is
# deliberate: it uses the pure-Rust `zbus` D-Bus client instead of
# binding the system `libdbus-1` C library, so it needs no extra system
# package beyond what CI's Linux dependency list already installs.
keyring = { version = "3", features = ["windows-native", "apple-native", "async-secret-service"] }

# ─── Async Runtime ───────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# ─── Error Handling ───────────────────────────────────────────
thiserror = "2"
anyhow = "1"          # For application-level error context (not in library code)

# ─── Provider Abstraction ────────────────────────────────────
async-trait = "0.1"

# ─── Utilities ───────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
base64 = "0.22"

# ─── Tauri Build ─────────────────────────────────────────────
[build-dependencies]
tauri-build = { version = "2", features = [] }

# ─── Test Dependencies ───────────────────────────────────────
[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio-test = "0.4"

# ─── Release Profile ─────────────────────────────────────────
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
