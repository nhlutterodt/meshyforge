    adr_refs: []
    notes:
      - "2026-11-23: EXECUTED (read-only grounding plus two disposable scan scripts in .claude/state/, not committed). Wrote concept-12 with a 7-row obligation register (O-1..O-7). KEY FINDING: DEP-06 has never been enforceable as written - 415 of 579 Rust production packages (71.7%) declare a multi-term SPDX expression that a literal string match rejects, including tauri's own MIT-OR-Apache-2.0 crates (331 of the 415 are that plain dual licence). It has also never been checked by anything (audit.yml runs only npm audit + cargo audit)."
      - "2026-11-23: SECOND KEY FINDING. All 5 MPL-2.0 packages (cssparser, cssparser-macros, dtoa-short, option-ext, selectors) are transitive through tauri itself (tauri-utils -> dom_query; tauri -> dirs -> dirs-sys), not project choices, so DEP-06 must distinguish direct dependencies from framework transitives. target-lexicon's 'Apache-2.0 WITH LLVM-exception' is a false positive any CHECK must normalise, or the check gets disabled."
      - "2026-11-23: THIRD KEY FINDING (provider terms). meshy.ai/terms-of-use returned HTTP 403, so the help-centre articles are SECONDARY sources, quoted with a 2026-11-23 retrieval date. Paid plan: 'full private ownership ... provided you do not publish them publicly to the Meshy Community and that you have used materials that do not violate the copyrights of others'. Free plan: 'we grant you a CC BY 4.0 license instead ... credit Meshy'. Consequences: (a) rights are a function of plan tier and no column records it; (b) two of three ownership predicates are unobservable by the app, so only a recorded user assertion can carry them; (c) CC BY 4.0 attribution is a licence CONDITION (CC BY 4.0 s3(a)), not the 'kindly ask' the wording implies; (d) export_asset_inner is std::fs::copy, so a free-tier delivery currently ships with no attribution at all."
      - "2026-11-23: FOURTH FINDING. @fontsource-variable/geist is a PRODUCTION dependency (OFL-1.1) imported at src/styles/globals.css:4, and its LICENSE names 'Copyright 2024 The Geist Project Authors'. release.yml attaches no LICENSE/NOTICE to any artifact, so O-1/O-2/O-3/O-5 are all unmet at the distribution trigger. Meshy_Documentation/ is tracked in a public MIT repo while its README:66 says '(c) 2026 Meshy LLC. All rights reserved.' - unresolved, three dispositions costed, deliberately NOT escalated."
      - "2026-11-23: npm side. 434 production packages; 9 fail a literal DEP-06 read, 5 of which are Tauri's own dual-licensed packages. webgl-constants@1.1.1 declares NO licence field at all (verified in node_modules, not inferred from the lockfile) and ships via detect-gpu -> @react-three/drei, so NOASSERTION must be a failure rather than a pass."

  - id: TASK-0036
    title: "Ground the outbound provenance record: field inventory, per-format carrier matrix, three record shapes, sidecar constraints (Concept 13 / Team 2)"
