  - id: TASK-0027
    title: "Replace Object3D.clone with SkeletonUtils.clone in AssetPreview3D (VP-17)"
    status: completed
    risk_level: 1
    capability_tier: T1
    owner: claude-opus-5
    created: "2026-09-11"
    updated: "2026-09-11"
    blocked_by: ["TASK-0026"]
    evidence_gate: "AssetPreview3D.tsx no longer calls scene.clone(true); a component test asserts SkeletonUtils.clone is invoked for the loaded scene; existing static-model preview tests still pass unchanged"
    adr_refs: ["ADR-0010"]
    notes:
      - "2026-09-11: Latent defect, not yet user-visible. Object3D.clone deep-clones bone nodes but leaves the cloned SkinnedMesh.skeleton bound to the ORIGINAL bones, so a skinned clone does not deform. Harmless today because nothing is animated; becomes a hard defect the moment TASK-0028 lands. Verified remedy is exported from node_modules/three/examples/jsm/utils/SkeletonUtils.js (three 0.170.0). Sequenced BEFORE playback so playback is never debugged against a broken clone."
      - "2026-09-11: DONE. scene.clone(true) replaced by clone() from three/examples/jsm/utils/SkeletonUtils.js (imported as cloneSkinnedScene). Covered by 'rebinds the scene with SkeletonUtils.clone, not Object3D.clone (VP-17)'. All 5 pre-existing static-preview tests pass unchanged."

  - id: TASK-0028
    title: "Implement animation playback in the viewport-control registry (VP-15, VP-16)"
    status: completed
    risk_level: 2
    capability_tier: T2
    owner: claude-opus-5
    created: "2026-09-11"
    updated: "2026-09-11"
    blocked_by: ["TASK-0026", "TASK-0027"]
    evidence_gate: "useViewportControls exposes playback state; AssetPreview3D renders play/pause only when animations.length > 0; frameloop is a single derived expression that evaluates to 'always' while playing or dragging and 'demand' otherwise; component tests cover clip-present and clip-absent paths; no TaskProvider call is made by any playback control"
    adr_refs: ["ADR-0010"]
    notes:
      - "2026-09-11: Requires no new dependency — @react-three/drei/core/useAnimations.js exists in the installed tree (drei 10.7.8) and useGLTF already returns the animations array, which is currently discarded at AssetPreview3D.tsx:44-54."
      - "2026-09-11: Must reconcile with UI/UX VP-02, which already mandates demand-by-default with a switch to always on pointer-down. VP-16 exists specifically to prevent two competing frameloop writers."
      - "2026-09-11: Follow the established test convention — mock the drei deep import individually, as AssetPreview3D.test.tsx already does for Bounds/Gltf/OrbitControls."
      - "2026-09-11: DONE. Playback state (isPlaying, activeClip, loopMode) added to useViewportControls per VP-15; frameloop is a single derived expression per VP-16; controls render only when clips exist; clip selector appears only for 2+ clips. Seven new tests under '3D preview animation playback (ADR-0010, TASK-0027/TASK-0028)'."
      - "2026-09-11: Defect found and fixed during implementation — the first draft called setState from inside a state updater function, which is impure and unsafe under StrictMode double-invocation. Reworked to derive the next state outside the updater."
      - "2026-09-11: A first-draft VP-14 test asserted on useGLTF call counts, which proves nothing (it is a hook, invoked once per render). Rewritten to assert that the Tauri invoke wrapper receives zero calls across a full play/pause/loop-toggle cycle."
      - "2026-09-11: Gates green — npm run lint (138 files, 0 errors), npm run type-check (0 errors), npm test (59 files / 419 tests passed)."

  - id: TASK-0029
    title: "Accept or reject ADR-0011 (public animation library endpoint + cdn.meshy.ai render origin)"
    status: completed
    risk_level: 2
    capability_tier: T3
    owner: claude-opus-5
    created: "2026-09-11"
    updated: "2026-09-11"
    blocked_by: []
