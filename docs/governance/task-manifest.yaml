  - id: TASK-0024
    title: "Implement ADR-0008 persistence integrity and full recovery without ever replacing a corrupt database with an unverified or empty one"
    status: in_progress
    risk_level: 3
    capability_tier: T2
    owner: claude-sonnet-5
    created: "2026-09-05"
    updated: "2026-09-05"
    blocked_by: []
    evidence_gate: "ADR-0008 implementation packages pass real-crate cargo test, cargo clippy -D warnings, migration upgrade tests, adversarial backup/quarantine/restore tests, and security-boundary review; no completion claim from an isolation harness alone"
    adr_refs: ["ADR-0008"]
    notes:
      - "2026-09-05: ANALYSIS. The current backend has no migration registry, no recovery directory, no backup API, no integrity check, and no recovery IPC. The first bounded package is migration infrastructure plus a recovery service seam; audit completion and UI recovery controls follow only after the storage contract compiles and proves its failure modes."
      - "2026-09-05: DECOMPOSITION. Package A: introduce sequential migration runner and migration 002 for task_log SET NULL plus assets.updated_at. Package B: add integrity-check and SQLite online-backup rotation primitives. Package C: add quarantine/newest-valid-backup restore workflow. Package D: wire bounded/redacted audit completion and mutation timestamps. Package E: expose sanitized recovery status/restore IPC. Package F: add adversarial real-crate tests and run security review."
      - "2026-09-05: ADVERSARIAL EVALUATION. The most dangerous failure is a recovery routine that copies only the main database file, ignores WAL/SHM state, or creates a fresh empty database after all backups fail. The implementation must keep the damaged files quarantined, validate every candidate with integrity_check, and make no replacement when no candidate passes."
      - "2026-09-05: FEEDBACK MECHANISM. Each package must have a focused compile/test gate before the next package. A failed migration or recovery test revises the package in place; it does not widen scope or mark the task complete. Security review is required before any recovery IPC is exposed."
      - "2026-09-05: PACKAGE A EXECUTED AND REVISED. Added migration 002 and a sequential runner. The first run exposed that fresh databases have no schema_version table; fixed with sqlite_master detection. The next run exposed that create-task audit logging occurs before the asset row exists; fixed by creating a task stub and replacing INSERT OR REPLACE with update-then-insert upsert semantics so audit FKs survive completion. Added upgrade coverage. Focused real-crate result: 23/23 storage tests passed."
      - "2026-09-05: PACKAGE B EXECUTED. Enabled rusqlite 0.31's existing backup feature and added Database::integrity_check plus WAL-aware Database::backup_to using the SQLite online backup API. Backup reopen/integrity/data-survival coverage passed; storage result: 24/24 tests passed."
      - "2026-09-05: PACKAGE C EXECUTED AND REVISED. Added RecoveryManager with bounded backup rotation, integrity-filtered candidate selection, quarantine of the live database plus WAL/SHM sidecars, atomic temporary restore, and a no-valid-backup path that refuses to create an empty database. The first adversarial run exposed Windows file-lock ordering; tests now make the closed-database lifecycle explicit. Recovery result: 2/2 focused tests passed; cargo clippy --lib -D warnings passed. IPC exposure, audit completion, timestamp mutation coverage, and full-repo validation remain open."
      - "2026-09-05: PACKAGE D PARTIAL EXECUTION. Wired assets.updated_at into task status, download, tag, favorite, and notes mutations while preserving the existing insert/upsert path. Focused real-crate storage result remains 24/24 passed. Audit response completion and sanitized recovery IPC are intentionally still open because the current provider response contract does not expose truthful HTTP status/body/credit data and no recovery command boundary has been designed yet. Draft-only doc-sync plan created at docs/doc-sync/2026-09-05-persistence-recovery-sync-plan.md."
      - "2026-09-05: SPECIALIST REVIEW SYNTHESIS. secure-delivery-agent and Explore independently confirmed that the storage primitives are not yet safe to call full recovery: RecoveryManager is not integrated into AppState/startup/IPC; Windows replacement requires the live SQLite handle to be closed; restore does not yet handle existing WAL/SHM files, staged replacement failures, migration-required backups, or quarantine metadata; audit payloads are unbounded/unredacted and response columns remain dead. They also independently confirmed two concrete source defects: insert_asset reset updated_at to created_at on upsert, and update_task_status read camelCase while raw Meshy polling responses are snake_case."
      - "2026-09-05: SPECIALIST-DRIVEN REPAIR. Corrected insert_asset to use the current mutation timestamp on upsert and made update_task_status accept raw snake_case with camelCase compatibility. Focused evidence: storage 24/24 passed; create_task_inner command tests 10/10 passed."
      - "2026-09-05: RECOVERY PATH DECISION REQUIRED. Path A is controlled in-process recovery: make Database replaceable, gate all database operations, quiesce commands, close the connection, quarantine the complete main/WAL/SHM set, restore and migrate a verified candidate, reopen, then expose sanitized IPC. Path B is restart/helper-process recovery: persist a sanitized recovery request, exit the Tauri process, let a recovery mode with no open SQLite handle perform quarantine/restore, then relaunch. Path A has better UX but a larger synchronization surface; Path B is safer for Windows file locking but adds packaging/restart trust-boundary complexity. No recovery IPC will be exposed until this choice is confirmed."
      - "2026-09-05: USER CONFIRMED PATH B. ADR-0009 accepted: destructive recovery runs in a dedicated restart mode of the existing executable before normal Tauri startup, using validated opaque backup identifiers, coordinated database/WAL/SHM quarantine, staged verified replacement, sanitized result metadata, and bounded restart-loop protection."
      - "2026-10-11: PRE-MIGRATION BACKUP (first production backup producer; starts closing finding I1). AppState::new_with_keychain backs up the live DB through RecoveryManager::create_backup_from_file (a normal read-only connection plus the online Backup API, so committed WAL rows are included) before Database::open runs pending migrations. The policy is fail-open, by owner decision: a failure logs PRE_MIGRATION_BACKUP_FAILED and startup continues. Backups land in recovery/backups, so recovery_status lists them and they restore through the C2 schema check. Built by a T1 builder (sonnet) on feat/pre-migration-backup with 5 tests and a revert proof."
      - "2026-10-11: START-FRESH DEFERRED. A user-confirmed 'start fresh, keep the damaged copy' recovery action would close the M5/N7/N10 dead-end class, but it conflicts with ADR-0008 (line 69, 'terminal recovery state') and this task's title ('without ever replacing a corrupt database with an ... empty one'). The owner chose to defer it. Reopening it needs an adr-log decision that amends ADR-0008/0009 to permit a user-confirmed start-fresh that preserves quarantine evidence."
      - "2026-11-23: AUDIT-COLUMN DECISION - CAPTURE THE HTTP ENVELOPE, NOT DROP THE COLUMNS. A freshness pass showed the columns already exist (001_initial.sql:40-41, carried through 002 as response_status/response_body) and that BOTH halves of the datum are already in reach: the client reads response.status() (client.rs:99-101) but discards it when response.json() consumes the body, and the raw body already travels as provider_payload (meshy.rs:347). So this is PROPAGATION, not capture: client keeps status + text on success, one http_status field reaches log_task_create (database.rs:701, currently INSERTing only task_id/endpoint/request_body/timestamp), and two existing columns get written. NO MIGRATION, NO NEW DEPENDENCY, and therefore no ADR (the ADR would only have been needed to DROP the columns)."
      - "2026-11-23: THREE LIMITS THAT MUST BE RECORDED WITH THE IMPLEMENTATION, not discovered later. (1) IT IS CREATE-ONLY: log_task_create is the sole production task_log writer (the other four INSERT INTO task_log statements are test fixtures), so response_status will mean 'the create call', NOT the task lifecycle. Polling is not audited at all, and auditing it is a retention decision, not a field addition - carried to TASK-0050. (2) THE BODY NEEDS A CAP: 001 already anticipates it ('truncated if large'); a task list with many artifacts must not bloat the row, so cap and mark truncation. (3) REDACTION IS NOT REQUIRED, and that is a finding rather than a shortcut: signed download URLs in the body are NOT a new disclosure surface because assets.file_paths already persists the same provider URLs before download. Consistency beats inventing a rule for one column."
      - "2026-11-23: REMAINING FOR THIS TASK, after the audit decision: timestamp mutation coverage (the five mutations were wired 2026-09-05; what is missing is TESTS), a full-repo gate run with the numbers pasted, and a security-boundary review SCOPED to the storage primitives. Do NOT claim TASK-0025's recovery review satisfies this one - different surface, and saying otherwise is the scope overreach this programme keeps catching."

  - id: TASK-0025
    title: "Implement ADR-0009 restart-mode recovery without opening normal SQLite state before request validation"
    status: in_progress
    risk_level: 3
    capability_tier: T2
    owner: claude-sonnet-5
    created: "2026-09-05"
    updated: "2026-11-24"
    blocked_by: []
    evidence_gate: "Process-mode unit tests, real file-backed recovery tests, cargo clippy -D warnings, and security review prove request validation, quarantine, staged replacement, no-valid-backup refusal, and bounded restart behavior before Tauri IPC exposure"
    adr_refs: ["ADR-0009", "ADR-0008"]
    notes:
      - "2026-09-05: ANALYSIS. main.rs invokes meshyforge::run() immediately and AppState::new() opens the database before any recovery check. Path B requires an early process-mode branch that resolves only the data directory, validates a recovery request, and performs recovery without constructing AppState."
      - "2026-09-05: DECOMPOSITION. Package A: stable recovery request/result schema and command-line mode parser. Package B: canonical backup identifier validation and coordinated quarantine metadata. Package C: staged restore plus migrations and restart-loop marker. Package D: startup integrity detection and recovery-required status. Package E: sanitized IPC/UI status and explicit user-confirmed request creation."
      - "2026-09-05: ADVERSARIAL EVALUATION. The sharpest risks are normal startup opening the corrupt DB before recovery mode, arbitrary path injection through a restore request, replacing a live database or stale WAL/SHM pair, and an automatic crash/restart loop. Tests must prove each is rejected before UI wiring."
      - "2026-09-05: FEEDBACK MECHANISM. Keep Packages A-C process/storage-only and independently testable. Do not expose restore IPC until request validation and staged replacement pass security review; failed tests revise the process contract rather than adding frontend workarounds."
      - "2026-09-05: PACKAGE A EXECUTED. Added storage/recovery_protocol.rs with exact recovery-mode argument parsing, stable request/result enums, one-attempt loop protection, opaque backup-ID validation, recovery-root containment checks, and sanitized result serialization. Adversarial focused result: 5/5 tests passed. Normal startup remains unwired until Package B/C prove filesystem recovery semantics."
      - "2026-09-05: PACKAGE B EXECUTED. RecoveryManager quarantine now treats the database, WAL, and SHM files as one coordinated move: if a sidecar move fails, already-moved files are rolled back and the quarantine directory is removed. Successful quarantine writes sanitized report.json metadata containing only the quarantine ID and safe filenames. Focused result: 7/7 recovery/protocol tests passed; cargo clippy --lib -D warnings passed. Normal startup and recovery-mode execution remain open for Package C."
      - "2026-09-05: PACKAGE C EXECUTED. Added RecoveryManager::restore_backup(backup_id), resolving only an opaque ID beneath recovery/backups, removing stale restore staging deterministically, opening the staged copy through Database::open so migrations run, checkpointing WAL, rechecking integrity, quarantining the live set, and replacing only after validation. Focused result: 8/8 recovery/protocol tests passed; full Rust result: 232 passed, 5 ignored, 0 failed; cargo clippy --lib -D warnings passed. Main startup integration remains the next package."
      - "2026-09-05: PACKAGE D PARTIAL EXECUTION. Added pre-Tauri process integration: main.rs now calls run_process(args); normal mode detects a pending request and launches the same executable with --recovery-mode; recovery mode validates and executes restore without constructing AppState, writes sanitized result metadata, removes failed requests to prevent loops, and relaunches normal mode after success. Focused protocol/recovery result: 8/8 passed; full Rust result: 232 passed, 5 ignored, 0 failed; cargo clippy --lib -D warnings passed. Remaining Package D work is startup integrity failure detection and a non-database recovery-required status path."
      - "2026-09-05: ADVERSARIAL PASS. Two independent specialist reviews confirmed that the limited screen and fallback were not reachable end-to-end, request/result writes were non-atomic, attempts were parsed but not advanced, concurrent launches could consume one request twice, and final replacement or quarantine metadata failures could leave the live database absent. They also confirmed that recovery UI must be a separate Tauri mode with no AppState or SQLite connection."
      - "2026-09-05: ADVERSARIAL REVISION. Added atomic result/request writes, request claiming with bounded attempt progression, quarantine metadata before file moves, and rollback of the quarantined live set when final replacement fails. Focused protocol result: 6/6; recovery result: 8/8; clippy passed."
      - "2026-09-05: PACKAGE D EXECUTED. Normal preflight now checks an existing database with PRAGMA integrity_check before AppState construction; failure writes sanitized startup-status.json and launches a database-free Tauri recovery builder. Added filesystem-only recovery_status and user-confirmed request_recovery_restore commands, opaque backup listing, atomic request creation, and RecoveryScreen/App gating. Recovery UI tests: 2/2; full frontend: 59 files/410 tests; full Rust: 233 passed, 5 ignored; tsc passed. Existing Biome warnings remain only in useActiveTaskPolling.ts dependency analysis."
      - "2026-10-11: SECURITY REVIEW (evidence gate) FAILED. Independent T2 review by a read-only reviewer (opus): 2 High, 5 Medium, 8 Low, 3 Info. Report: docs/audits/security-review-task-0025-recovery-2026-10-11.md. H1: an exhausted or interrupted restore leaves request.json, so recovery respawns on every launch with no window. H2: request_recovery_restore is registered in normal mode while the live DB is open (RST-DB-04), and stale startup-status/result files keep the recovery screen up. M1: a 0-byte or foreign .db file is accepted as a backup. M4: the preflight integrity check opens the DB read-write and treats any error as corruption. I1: create_backup has no production caller, so with M4 a single failed check leaves users on a permanent 'no backup' screen. The orchestrator re-verified H1/H2/M1/M4/I1 against source. The ledger's earlier 'ADVERSARIAL REVISION' claim that the request claim is atomic is contradicted by M2."
      - "2026-10-11: REMEDIATION STARTED. Owner held release 1.1.0 and approved fixing H1, H2, M1 and M4 with tests (T1 builder on sonnet, in an isolated worktree; T2 re-review on opus) on branch fix/task-0025-recovery-hardening. M2, M3, M5, L1-L8 and I1-I3 remain open and out of that scope. The gate closes only after the fixes merge and a re-review reports them CLOSED."
      - "2026-10-11: REMEDIATION VERIFIED. Branch fix/task-0025-recovery-hardening: 7 commits (M4, M1, H2, H1, an H1 loop guard, N1, N5). Three narrow re-review cycles: cycle 1 found the N1 regression (relaunch after a failed restore created an empty DB); cycle 2 found N5 (the evidence rule caused a permanent recovery screen after a deliberate DB delete); cycle 3 PASS, 0 blockers. H1/H2/M1/M4/N1/N5/N6 CLOSED. Orchestrator-run gates: fmt clean, clippy -D warnings exit 0, cargo test 281 passed/5 ignored. Still open: M2, M3, M5, L1-L8, N2-N4, N7-N9, I1-I3 (see the audit addendum section 7). Tier note: the T1 builder (sonnet) produced two regressions that only the T2 reviewer (opus) caught. This supports keeping recovery-path security review at T2, and it is evidence against demoting recovery fixes below T1 without an independent review."
      - "2026-10-11: MERGED as #10 (f506478, all 9 CI checks green on Windows, macOS and Linux). PR review raised three more findings, all fixed before merge and re-checked in cycle 4 (opus, PASS): N8 (Codex P1; LIVE_DATABASE_MISSING now preserves displaced-DB evidence), C2 (Copilot High; staged backups must match a reference schema built from MIGRATIONS, so a spoofed schema_version cannot skip migrations), and C3 (Copilot Medium; raw Unix path bytes in the immutable URI). New Low follow-ups: N10, C2-a, C3-a. The owner approved a PR-11 size exception rather than a split. The gate passes for H1/H2/M1/M4/N1/N5/N6/N8/C2/C3; the task stays in_progress for M2/M3/M5 and the Low items."
      - "2026-11-23: M3 CLOSED. remove_stale_staging_file removed only the staging DATABASE, so a stale -wal/-shm pair could be REPLAYED onto the next staged copy - a corrupt restore produced by a cleanup that looked complete. It now removes the whole set (db, -wal, -shm) or fails closed on a non-file. Test: stale_staging_sidecars_are_removed_with_the_staging_database."
      - "2026-11-23: M5 CLOSED, AND IT WAS WORSE THAN 'RAW OS TEXT'. The rollback path returned Err(error.to_string()), which was TWO defects: raw OS text crossing the boundary (L1's class), and - because the caller cannot recognise that string - a failed quarantine being treated as NO EVIDENCE, so normal start created a fresh empty database over the wreckage. Fixed by tracking whether the rollback itself succeeded and returning a fixed code: QUARANTINE_FAILED when the live set is intact (nothing moved, retry safe) or QUARANTINE_ROLLBACK_FAILED when files are split across two locations (added to LIVE_DATABASE_DISPLACED_CODES, so the recovery UI owns it). The quarantine ENTRY path (create_dir_all) leaked the same way and was fixed too - without it the fix was incomplete, since failing to even create the directory also leaked an unrecognised code. Test: quarantine_failure_returns_a_fixed_code_not_os_text."
      - "2026-11-23: THE NEW DISPLACED CODE IS COVERED BY CONSTRUCTION. An existing test iterates LIVE_DATABASE_DISPLACED_CODES and asserts missing_database_has_recovery_evidence is true for each, so adding a code cannot skip a behavioural assertion."
      - "2026-11-23: M2 STILL OPEN - this task does NOT close. The request claim is still non-atomic and concurrent recoveries still share the fixed restore.tmp staging path. It needs a per-process staging name plus an exclusive lock file. Do not mark this task completed until M2 is fixed or accepted in an ADR-0009 amendment, which is the audit's own closure condition."
      - "2026-11-23: FRESHNESS FINDING FOR TASK-0050. recovery.rs still contains 14 raw `map_err(|error| error.to_string())` sites outside the two fixed here. That is L1's scope (raw OS error text in failure_code crossing IPC), not M5's, and it stays open deliberately rather than being swept in. Also: I1 closed on 2026-10-11 by the pre-migration backup, which ACTIVATED N7 and N10 - see TASK-0050."
      - "2026-11-24: M2 CLOSED - THE LAST OPEN MEDIUM. Two halves, as the audit prescribed. (1) An exclusive lock file recovery/restore.lock created with O_CREAT|O_EXCL (atomic on NTFS and POSIX, NO new dependency) is held for the WHOLE attempt in run_recovery_process, which is what makes the read -> next_attempt -> write claim atomic. The loser exits without writing a result, retiring the request or opening a window - any of those would clobber the winner. (2) Each restore stages under a per-attempt name (pid + atomic counter), so even a stolen or bypassed lock degrades instead of corrupting. Audit section 8 records the design."
      - "2026-11-24: THE M2 RACE IS NOW REPRODUCED, NOT ARGUED. concurrent_recovery_attempts_produce_exactly_one_winner races two threads through the real claim; a revert proof with the lock disabled produced TWO winners (left: 2, right: 1). The audit had listed 'Reproductions of the M2 and M3 races' under Not Performed - that gap is closed for M2."
      - "2026-11-24: THREE DEFECTS THE FIX ITSELF WOULD HAVE INTRODUCED, caught while writing tests rather than after. (a) A stale owner whose lock was stolen would DELETE THE NEW OWNER'S LOCK on drop; the guard now carries an owner token (pid, stamp, nonce) and removes only a lock it still owns. (b) An unconditional sweep of abandoned staging files would delete a LIVE concurrent restore's staging file - a new race created by the cleanup; the sweep is age-gated on the same window as the lock, and only the legacy fixed name (unproducible by current code) is swept unconditionally. (c) create_new and the write are two steps, so a racing process can see an EMPTY lock file; judging by content alone would call a microseconds-old lock corrupt and steal it, so age falls back to mtime."
      - "2026-11-24: A LEAK THE FIXED NAME USED TO HIDE. checkpoint_staged_database(...)? returned early without removing the staging file. With a fixed name the next run cleaned it up; with unique names nothing would. A Drop guard now owns cleanup on every exit path. Test: a_rejected_restore_leaves_no_staging_set_behind."
      - "2026-11-24: CLOSURE STATUS - READ CAREFULLY. The audit's section 6 condition ('M2, M3 and M5 fixed or explicitly accepted in an ADR-0009 amendment') is now met BY FIXES, with no ADR amendment. This task is still left in_progress for ONE reason: no independent re-review scoped to M2 has been run, and this task's own history is that the T1 builder produced two regressions (N1, N5) that only the T2 reviewer caught. Declaring completion on the builder's own evidence is exactly the overclaim this ledger keeps catching. L1-L8, N2-N4, N7, N9, N10, C2-a, C3-a, I2, I3 remain under TASK-0050 and do NOT block this task."
      - "2026-11-24: VERIFIED. cargo fmt --check 0; clippy --all-targets -D warnings 0; cargo test 413 lib passed + 18 IPC passed, 5 ignored, 0 failed (10 new tests: 6 lock, 3 staging, 1 concurrency). Doc-sync applied: CHANGELOG's stale '(open M5)' exception replaced, audit section 8 appended (section 7's 2026-10-11 record left intact)."
