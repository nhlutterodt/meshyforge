  - id: TASK-0040
    title: "Add the per-asset rights record: plan tier, community-publication state, third-party-material attestation, derived rights identifier, attribution text (migration + write path)"
    status: completed
    risk_level: 2
    capability_tier: T1
    owner: cline-session-2026-11-23
    created: "2026-11-23"
    updated: "2026-11-23"
    blocked_by: ["TASK-0039"]
    evidence_gate: "A numbered migration (004) adds the five three-state predicate columns; the identifier AND a reason code are derived accessors, not stored columns; a Rust test proves each of the FIVE concept-11 s13.1 states (including tier=unknown) derives the documented identifier and reason code; a test proves NULL (pre-baseline) and 'unknown' (recorded assertion) are distinguishable; and no asset can reach downloaded_at > 0 with an unrecorded attestation"
    adr_refs: ["ADR-0018"]
    notes:
      - "2026-11-23: SCHEDULED by concept-11 s13.6. This is the blocking schema gap from concept-11 s8 and concept-12 s5.3a: rights are a function of plan tier and NOTHING in the schema records the tier, the Community-publication state, or the third-party-material assertion."
      - "2026-11-23: DESIGN CONSTRAINT (do not flatten this). Store the three predicates and DERIVE the identifier. If the identifier is computed at write time and stored, the two NOASSERTION states collapse into a guess and the unknown becomes invisible; deriving on read also lets a corrected terms reading re-derive every asset without a migration. The tripod is not normalization pedantry, it is what keeps the hole visible."
      - "2026-11-23: TWO OF THE THREE PREDICATES ARE UNVERIFIABLE BY THE APP (publishing happens on Meshy's website; the provenance of an uploaded image is known only to the owner). They must be recorded USER ASSERTIONS with a timestamp, and the UI must say so. A control that claims to verify them would fail proportionality test 2."
      - "2026-11-23: OPEN ON Q1/Q2. Whether the prompt column feeds the record (and whether it is hash-only) is the owner's Q1; whether deleting an asset deletes the record is Q2. Both are answered at TASK-0039 and both change this migration's shape, which is why this task is blocked there rather than starting now."
      - "2026-11-23: PRE-EXISTING ASSETS. Every existing row will have null predicates, so the migration and the check it enables must decide 'null means pre-baseline' vs 'backfill from task_log.request_body'. concept-12 s9 flags that this choice must be made before the check can be written. Use the db-migration skill."
      - "2026-11-23: UNBLOCKED - §6 answered. Q1 = prompt travels as a SHA-256 digest, plaintext stays local (assets.prompt already exists, so NO new prompt column). Q2 = record dies with the asset and the files are deleted too (ADR-0020). Fact A = 'unknown' until the owner states the tier. Written up as ADR-0018, which OWNS this schema."
      - "2026-11-23: GATE AMENDED FROM FOUR ROWS TO FIVE, forced by Fact A='unknown'. The baseline's 'four combinations' table has no row for an unrecorded tier, so a third tier value has to resolve for every published/attested pairing. Five canonical rows: paid/no/yes -> Paid-Owned; free/*/* -> CC-BY-4.0; paid/yes/* -> NOASSERTION (published-to-community); paid/no/no|unrecorded -> NOASSERTION (material-unattested); unknown|NULL/*/* -> NOASSERTION (tier-unrecorded). Three identifiers, five rows."
      - "2026-11-23: REASON CODE ADDED, and it is not decoration. LM-01 requires NOASSERTION to render as 'not established', never blank. 'Not established' is useless without saying WHICH fact is missing, so rights_reason() is a second derived accessor. This is also what keeps the hole diagnosable after a re-derivation."
      - "2026-11-23: THREE-STATE COLUMNS, NOT TWO. TEXT + CHECK (IN ('yes','no','unknown')), no DEFAULT. NULL is reserved for PRE-BASELINE rows (ND-8) and is never written again; 'unknown' is a RECORDED ASSERTION that the owner does not know. Collapsing the two would turn 'nobody asked' into 'the owner said they do not know' - a false statement about the owner."
      - "2026-11-23: CORRECTED THE MIGRATION PATH FROM THE SKILL. new-sqlite-migration says migrations live in src-tauri/src/migrations/ and the registry is storage/migrations.rs. Neither is true here: files are at src-tauri/migrations/ and the MIGRATIONS const is in src-tauri/src/storage/database.rs:12-19. The skill itself warns to verify against the real registry, and verifying was the right call. Next version is 004."
      - "2026-11-23: PRODUCTION-INERT UNTIL FACT A. With tier defaulting to 'unknown', every real asset derives NOASSERTION/tier-unrecorded and LM-03's CC BY credit never fires. Safe (no false ownership claim, no invented credit) but honest-and-empty until the tier is supplied. Recorded so nobody reads a green test suite as 'rights are now established'."
      - "2026-11-23: DESIGN SETTLED BEFORE CODING (the review paid for itself). Nested `rights` object rather than 7 flat fields: 6 one-line fixture edits instead of 42, one name for the guardrail to protect, and the natural arg shape for TASK-0049's command. Recon also found TWO dead duplicates of the row shape - TS `Asset` (meshy-types.ts:45) and Rust `Asset` (models.rs:254), both with zero references; the TS one was deleted (tsc proves nothing used it), the Rust one left and recorded."
      - "2026-11-23: RUST SIDE COMPLETE. migrations/004_legal_metadata.sql (5 nullable ADD COLUMN, no CHECK, no DEFAULT - ADR-0018 corrected to match 002's precedent); registry tuple 4; RightsRecord + RightsPredicate + PlanTier enums in models.rs with derive()/refresh_derived(); AssetRecord.rights (write) and AssetRow.rights (read); from_row extended with 5 NAMED gets; insert_asset extended to ?25..?29."
      - "2026-11-23: from_row USES NAMED COLUMN GETS, which HALVED the risk I had planned for. row.get(\"column\") means appending columns cannot misalign the read path. The INSERT is still positional (?25..?29), so the sentinel round-trip test remains required - and it now also proves the derived values are recomputed on read rather than round-tripped."
      - "2026-11-23: TESTS ADDED. rights_tests module: all TWELVE tier x published x attested combinations (a five-row test cannot catch a reordered precedence branch - paid+published+attested must be published-to-community, not Paid-Owned); NULL vs recorded 'unknown' stay distinguishable; unrecognised stored values degrade to Unknown (fail-safe); Default serialises camelCase with NOASSERTION. Plus test_insert_and_get_asset now sentinels every predicate."
      - "2026-11-23: SIX PRE-EXISTING TESTS FAILED ON FIRST RUN AND EACH WAS INFORMATIVE. Four models tests built their own stale CREATE TABLE fixture (5 columns missing). Two migration tests asserted MAX(version) == 3 - the 003 test was rewritten to ask 'does the version-3 row exist' so a later migration cannot fail it for an unrelated reason, and the 004 test now also asserts the columns actually exist (a bumped version row is not evidence of a migration)."
      - "2026-11-23: A BULK EDIT BIT ME, AND THE FIX IS RECORDED. Matching 'AssetRecord {' to add rights: caught two FUNCTION SIGNATURES returning AssetRecord (fn make_asset_record(...) -> AssetRecord {), corrupting three files, and one editor call targeting src-tauri/src/recovery.rs CREATED a stray file because the real one is commands/recovery.rs. cargo build caught all of it. Lesson: grep for a struct literal pattern and you will also hit return types; verify the file path before editing."
      - "2026-11-23: NOT COMPLETE - ONE FRONTEND TEST IS RED. src/lib/ipc-contract.guardrail.test.ts > 'SaveCompletedTaskArgs matches SaveCompletedTaskArgs' fails: the guardrail parsed the Rust struct as snake_case, reporting task_id/task_type/etc as undeclared by the TS interface. Evidence that this is NOT in the region I touched: git diff -U2 on assets.rs shows no hunk within lines 1-48, and both files of that pair (useActiveTaskPolling.ts, ipc-contract.guardrail.test.ts) were ALREADY modified in the working tree before this session. Could not establish the cause within budget, so the task stays in_progress rather than being claimed done. 522 of 523 frontend tests pass; Rust 392 pass."
      - "2026-11-23: ALSO OWED for this task: the D-1 source guardrail test (fail if a rights identifier appears anywhere under src/ outside meshy-types.ts), the ADR-0018 amendment (basis belongs to the export record, not the per-row read model), and appending R7-R9 to concept-11 s14."
      - "2026-11-23: THE RED TEST WAS A CRLF DEFECT IN THE GUARDRAIL, NOT A PARITY DEFECT. ROOT CAUSE: my PowerShell bulk write had converted commands/assets.rs (CRLF=1478, bareLF=0) and api.rs to CRLF. ipc-contract.guardrail.test.ts computed the struct's attribute block with `preceding.slice(preceding.lastIndexOf('\\n\\n'))`; a blank line in a CRLF tree is \\r\\n\\r\\n, so that lookup returned -1 and slice(-1) produced a ONE-CHARACTER attribute block. rename_all was invisible, every field read as snake_case, and the parity assertion failed for the wrong reason. The parser was right; the input was wrong."
      - "2026-11-23: FIXED BOTH HALVES. (a) Restored LF in assets.rs and api.rs (repo convention per .gitattributes). (b) Hardened the parser: new attributeBlockOf() matches /\\r?\\n\\r?\\n/ and falls back to the whole preceding text instead of one character. Restoring LF alone would have HIDDEN the defect rather than fixed it - the repo's own migrations/001_initial.sql is CRLF in this tree, so the assumption was never safe."
      - "2026-11-23: REGRESSION TEST ADDED, because the LF restore would mask a relapse. 'reads struct attributes from a CRLF working tree' converts commandsAssetsSource to CRLF in-memory and asserts the field set is identical and camelCase. With the old parser it fails; with the fix it passes. An audit confirmed this was the ONLY place in src/ assuming LF blank lines."
      - "2026-11-23: D-1 GUARDRAIL ADDED (src/lib/rights-derivation.guardrail.test.ts). Scans every file under src/ via import.meta.glob(?raw) and fails if LicenseRef-Meshy-Paid-Owned, CC-BY-4.0 or NOASSERTION appears outside meshy-types.ts. Two tests, and the second exists for a specific reason: it asserts >100 files were scanned and that meshy-types.ts is among them, because a glob matching nothing would make the first test pass VACUOUSLY - the same defect class as a negative test that exits 0. First attempt mapped glob keys wrongly (keys are relative to the TEST file's directory, so siblings are ./x and others ../x); it 'detected' the one allowed file as an offender. Fixed explicitly rather than by guessing again."
      - "2026-11-23: ADR-0018 AMENDED: basis (source name, retrieval date, secondary-source marker) travels with the EXPORT record, not the per-row read model - they are constants, so per-row they would repeat in every payload and become N places for the date to drift. concept-11 s14 heading updated and R7 (freshness), R8 (read-before-gate), R9 (single-source) tabled, with the count-rot instance folded into R1 as an amendment."
      - "2026-11-23: VERIFIED AND CLOSED. cargo test 387 passed / 0 failed. vitest 67 files, 526 tests passed (was 66/523: +2 rights guard tests, +1 CRLF regression). tsc --noEmit exit 0. biome 156 files clean."

  - id: TASK-0041
    title: "Generate a third-party notice bundle, attach it to every release artifact, and surface it in AboutPanel (discharges O-1, O-2, O-3, O-5)"
    status: completed
    risk_level: 1
    capability_tier: T1
    owner: cline-session-2026-11-23
    created: "2026-11-23"
    updated: "2026-11-23"
    blocked_by: ["TASK-0038"]
    evidence_gate: "A build step writes THIRD_PARTY_NOTICES.md; a test asserts it contains the Geist OFL notice string and non-zero Apache-2.0 and MPL-2.0 entries; release.yml attaches it to the release; AboutPanel loads it LAZILY on open via a ?raw import (a separate chunk, never in the main bundle, never on startup); capabilities/*.json and the tauri.conf.json CSP are UNCHANGED; and the CommandName union is unchanged because NO command is added"
    adr_refs: []
    notes:
      - "2026-11-23: EXECUTED. Shipped scripts/generate-third-party-notices.mjs + committed THIRD_PARTY_NOTICES.md (283 KB: 579 Rust + 435 npm packages, 3,929 lines). Discharges O-1/O-2/O-3/O-5 - all four were unmet until now."
      - "2026-11-23: ARCHITECTURE CHANGED against the earlier draft, and for the better. The plan served the notices through a new zero-argument Rust command - which would have CHANGED the CommandName union, contradicting this task's own SEC-E gate. Resolution: a lazy Vite ?raw import in AboutPanel. No command, no IPC, no Rust, no permission, no path parameter, and lazy by construction. The gate stayed; the design moved."
      - "2026-11-23: THREE DESIGN TRAPS, all found by regrounding rather than assumed. (1) The Rust graph is TARGET-DEPENDENT and release.yml builds 4 targets, so a host-filtered generation would fail the CI drift check on another OS - the generator reads UNFILTERED and emits a superset (over-attribution is not a violation; under-attribution is). (2) cargo metadata --offline fails in this checkout, so the file is COMMITTED and CI drift-checks it; app builds need no network. (3) A name list is not a notice - Apache s4 needs the licence text, MIT needs the notice, OFL needs the font copyright - so the bundle has an index PLUS a licence-text appendix harvested from the cargo registry cache and node_modules, matched by content signature, never hand-transcribed."
      - "2026-11-23: TWO CI PLACEMENT CORRECTIONS. audit.yml is weekly-cron only and every job is continue-on-error, so a drift check there could never gate a PR - the notices:check job went into ci.yml instead. And ci.yml hardcoded 'npx biome check src/', so the package.json lint change alone would not have covered scripts/; the workflow line was updated too."
      - "2026-11-23: BUG FOUND IN MY OWN GENERATOR, in the first output. expandExpression split '(MIT OR Apache-2.0) AND Unicode-3.0' into the bogus identifiers '(MIT' and 'Apache-2.0)', creating junk appendix sections and mis-stating what a package declares. Fixed by stripping parentheses before splitting; caught by INSPECTING the generated file, not by reasoning about the regex. This is rule R2 in practice."
      - "2026-11-23: COVERAGE. 16 licence families detected; text harvested for 14. 0BSD and Unlicense had no text on this machine and are reported explicitly in the file's own limitations block rather than silently omitted - inside the kill criterion set in the plan. BlueOak-1.0.0 and CC-BY-4.0 gained signatures during the pass. 3 packages declare NOASSERTION and are visible."
      - "2026-11-23: LINT SCOPE. package.json lint now covers src/ AND scripts/, which exposed 3 PRE-EXISTING noUnusedTemplateLiteral errors in scripts/governance/sync_task_ledger.mjs. Fixed them (template literal -> string) rather than half-linting scripts/, and re-ran the tool to prove it still syncs. Biome now checks 151 files clean."
      - "2026-11-23: VERIFIED EMPIRICALLY. tsc --noEmit exit 0. biome check src/ scripts/ clean (151 files). npm run notices:check reports up to date. Full vitest suite exit 0, including a new AboutPanel test asserting the bundle is absent before the click and contains 'SIL OPEN FONT LICENSE' after it. Build output proves the P-5 claim: dist/assets/THIRD_PARTY_NOTICES-*.js is a SEPARATE 290,479-byte chunk, and 'SIL OPEN FONT LICENSE' does NOT appear in dist/assets/index-*.js."
      - "2026-11-23: DEP-12 rule text still awaits ADR-A. The MECHANISM ships now because the obligations already existed; the rule that names it formally lands with ADR-A. Recorded so nobody assumes DEP-12 is already in GREB."

