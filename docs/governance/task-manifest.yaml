    adr_refs: []
    notes:
      - "2026-11-23: EXECUTED (read-only grounding). Wrote concept-13. VERIFIED from KhronosGroup/glTF specification/2.0/schema/asset.schema.json: asset.copyright is a normative string 'suitable for display to credit the content creator', asset.generator is a normative string, and extras arrives via $ref glTFProperty. So GLB needs no new dependency - it is a JSON-chunk rewrite over serde_json, already present in Cargo.toml."
      - "2026-11-23: CARRIER MATRIX. GLB/.gltf embedded = low cost, verified. 3MF = has a metadata mechanism (Core v1.4.0 TOC confirms s6.2 Core Properties, s6.3 Digital Signatures, Appendix B.2 metadata example) but the reserved metadata NAME VOCABULARY was NOT retrieved - the markdown exceeded the fetch window and the PDF returned as undecoded binary - so no metadata key may be cited yet. USDZ = UNVERIFIED (assetInfo / customLayerData / 64-byte alignment all unconfirmed). FBX = not practical, and the Autodesk SDK would fail DEP-06 anyway. OBJ/STL = sidecar: writable but not durable (OBJ comments are dropped on re-export; the STL 80-byte header trips the binary-vs-ASCII heuristic)."
      - "2026-11-23: SHAPES. A sidecar-only (cheapest, format-agnostic, detaches at the first upload), B embedded-where-cheap + sidecar-always (recommended shape), C embedded-only (the only genuinely wrong option - it converts a coverage gap into a silent absence for 4 of 6 formats). A and B differ by one GLB code path, so the baseline can adopt A and extend to B without a rewrite, provided the sidecar schema comes first and the embedded form is a projection of it."
      - "2026-11-23: TWO TRAPS RECORDED. (1) If a content hash is emitted it must be computed AFTER embedding, not from the stored file - a one-line ordering bug with total loss of value. (2) Content hashing is NOT free: Cargo.toml has no sha2/blake3/hex and std has no crypto hash, so it implies a new dependency; the defensible v1 omits the hash and records it as a deliberate omission. Also: editing a GLB at export means MeshyForge no longer ships Meshy's bytes unmodified - that belongs in the ADR, not a commit message."
      - "2026-11-23: SEAM CONTRACT NOTE. export_asset_inner takes a PATH, not an asset id (assets.rs:269-282), so it cannot look up prompt/ai_model/rights today. Adding asset identity is a contract change => ADR-class, and it must not weaken the existing containment check that the path is rooted under data_dir/assets."

  - id: TASK-0037
    title: "Ground disclosure and attestation posture: AI-generated disclosure, C2PA/Content Credentials support for 3D, signing identity, record-vs-certify line (Concept 14 / Team 3)"
