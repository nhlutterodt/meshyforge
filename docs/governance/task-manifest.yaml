      - "2026-11-23: EXECUTED (read-only grounding). Wrote concept-14. DECISIVE FINDING: EU AI Act Art. 50(4), retrieved verbatim from the EC AI Act Service Desk (based on the EUR-Lex consolidated text as at 27 July 2026), enumerates only 'image, audio or video content' and binds DEPLOYERS. 3D geometry is not enumerated, so no Art. 50(4) obligation attaches to a GLB/FBX/OBJ/STL/USDZ/3MF file. Art. 113 confirms application from 2 August 2026, and Art. 50 is not among the delayed exceptions, so it is IN FORCE as of this memo."
      - "2026-11-23: THE SPLIT (the actionable output). The obligation, where it exists, attaches to the rendered IMAGE, not the model - and the app already stores one (assets.thumbnail_path). Also: the 'constituting a deep fake' qualifier plus the evident artistic/creative carve-out in para 4 reduces any real duty to a non-intrusive notice, and para 5 fixes the trigger at publication ('first interaction or exposure'), not export."
      - "2026-11-23: C2PA REALITY. C2PA 2.5 exists and is ISO-structured (ISO/TC 171 SC 2), but the normative supported-format table was NOT retrievable (~725k-char page) so nothing is asserted about it. No 3D format has an embedding binding; sidecar only. An independent 2026-11-14 test (Blender 5.2.1, trimesh 4.11.1, c2patool 0.28.4, PrusaSlicer 2.9.6) found ALL THREE embedded GLB marks (KHR_xmp_json_ld, asset.extras, asset.generator) disappeared on a single Blender round-trip even with export_extras=True (upstream glTF-Blender-IO #2149), and the .c2pa sidecar failed validation after any re-save."
      - "2026-11-23: SELF-CORRECTION ISSUED. That durability finding corrects concept-13, which measured cost-to-write but not survival. concept-13 s3.1 now carries the pointer and forbids any control that DEPENDS on the mark surviving the recipient's first tool. This is the kind of correction the grounding process exists to produce."
      - "2026-11-23: RECORD-VS-CERTIFY CONFIRMED, and candidate question Q4 dissolved. The app performs no publication, so it cannot be the duty-bearer; the honest control set is record the facts + inform at export. C2PA signing is recommended for the NOT-DONE register (no obligation requires it, and per the durability finding it evaporates on first re-save), not deferred as future work."
      - "2026-11-23: TWO CANDIDATE CONTROLS for TASK-0038 to price, probably cut to one. D-1: a fourth recorded user assertion ('depicts a real person or event in an invented situation', explicit unknown default), folding into the TASK-0040 migration rather than needing its own. D-2: a dismissible one-line note at export. Deliberately NOT proposed: signing, any blocking export gate."
      - "2026-11-23: JURISDICTION STATED, NOT GUESSED. Everything is the EU position; applicability depends on the owner or a client being in the EU/EEA, which is a fact not derivable from the repo. Framing is that the EU reading is the strictest available, so 'unnecessary under EU' implies 'unnecessary under weaker.' D-1/D-2 stay safe either way. NEW INPUT NEEDED FROM OWNER: jurisdiction."

