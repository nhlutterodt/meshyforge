  - id: TASK-0008
    title: "Adversarial audit of SQLite persistence architecture: layers, integrity, auditing, telemetry"
    status: completed
    risk_level: 0
    capability_tier: T2
    owner: claude-sonnet-5
    created: "2026-09-04"
    updated: "2026-09-04"
    blocked_by: []
    evidence_gate: "Findings cite concrete file:line evidence, not assumptions"
    adr_refs: []
    notes:
      - "2026-09-04: rusqlite, single Mutex<Connection>, WAL enabled, PRAGMA foreign_keys=ON correctly set on both open paths (src-tauri/src/storage/database.rs:18-19,30). One real migration file (migrations/001_initial.sql), not a tracked migration runner."
      - "2026-09-04: INTEGRITY GAP — task_log.meshy_task_id is commented as a foreign key (line 37) but is NOT actually declared as one; only asset_tags has real FKs (lines 61-62, CASCADE). No CHECK constraints anywhere (status/progress/booleans all unconstrained at the DB level)."
      - "2026-09-04: CORRECTNESS BUG — no SQL transactions anywhere in the backend (grep for BEGIN/transaction: zero results). update_tags (database.rs:199-230) does DELETE+INSERT OR IGNORE+INSERT+UPDATE as four unguarded separate execute calls under the same Mutex — a mid-sequence failure leaves tags/asset_tags/assets.tags inconsistent. delete_asset (297-308) has the same unatomic-multi-statement shape."
      - "2026-09-04: AUDITING GAP — task_log's response_status/response_body/error/credits_before/after columns are only ever INSERTed empty (log_task_create, 256-277) and never UPDATEd by anything — they are dead columns today. assets has no updated_at — favorite/notes/tags edits bump nothing."
      - "2026-09-04: DATA-LOSS RISK — Database::open (database.rs:15-25) has no PRAGMA integrity_check, no backup/rotation, no corrupt-file handling; a malformed meshyforge.db just fails app startup. docs/LESSONS_LEARNED.md #3 ('Local Persistence Is the Task History', lines 67-88) already establishes that local DB loss is unrecoverable from Meshy's side (no server-side workspace-list API) — so this is a real, not hypothetical, single-point-of-failure for a user's entire asset history."

  - id: TASK-0009
    title: "Wrap update_tags and delete_asset's multi-statement writes in real SQL transactions"
    status: completed
    risk_level: 1
    capability_tier: T1
    owner: claude-sonnet-5
    created: "2026-09-04"
    updated: "2026-09-04"
    blocked_by: []
    evidence_gate: "22/22 tests passed (`cargo test`) in an isolation harness at /tmp/db-verify — a standalone crate depending only on rusqlite 0.31 (bundled), serde, serde_json, chrono, tempfile, containing a byte-for-byte copy of src-tauri/src/storage/database.rs (only the `use crate::meshy::models::...` import path and one include_str! path rewritten to match the standalone layout), models.rs (verbatim AssetRecord/AssetRow), and the real migrations/001_initial.sql. This is NOT a substitute for `cargo test --manifest-path src-tauri/Cargo.toml` against the real crate: the sandbox has no root and cannot install the webkit2gtk/GTK system libraries the full Tauri crate needs, so the real crate has still never been compiled in this environment. CI (or a developer machine with the full toolchain) must still run the real `cargo test` before this is trusted for release — this evidence gate only closes the 'was the transaction-wrapping logic itself exercised against a real SQLite build' question, not the 'does the whole crate compile and pass CI' question."
    adr_refs: []
    notes:
      - "2026-09-04: Classified as Clarification, not ADR-worthy — this corrects an oversight against atomicity behavior the schema's own FK/CASCADE design already implies, it doesn't decide anything novel."
      - "2026-09-04: Verified — grep for \"transaction\"/\"atomic\" in coding_standards.md returns zero matches. No existing rule ID covers write atomicity, confirming the Clarification classification (nothing to contradict) but also meaning this fix should hand off to doc-sync proposing a new rule once landed, so this bug class doesn't recur silently elsewhere. Spot-checked update_tags (database.rs:199-230) directly: confirmed exactly four unguarded conn.execute calls as TASK-0008 reported."
      - "2026-09-04: Code written in src-tauri/src/storage/database.rs — update_tags now runs in a single rusqlite Transaction (rollback-on-drop covers any failure) and de-duplicates input tags first, since a duplicate tag name was a real, self-inflicted PRIMARY KEY violation on the second identical asset_tags insert, not just a hypothetical failure mode; delete_asset's redundant second DELETE was removed since asset_tags.asset_id already has ON DELETE CASCADE with foreign_keys=ON set on both open paths, so the cascade alone is atomic. Two new regression tests added: test_update_tags_is_atomic_and_deduplicates_repeated_input, test_delete_asset_cascades_asset_tags_via_foreign_key."
      - "2026-09-04: NOT VERIFIED BY COMPILATION — this sandbox has no Rust toolchain (cargo/rustc not found). rusqlite 0.31 is pinned in Cargo.toml; Connection::transaction(&mut self) and rollback-on-drop are stable, long-standing API in that version, and the code was reviewed manually against it, but that is not the same as a passing cargo test. Status intentionally NOT completed until cargo test is actually run — per this repo's own phase-gate-check principle, never report passed on partial evidence."
      - "2026-09-04: Rust toolchain became available in this sandbox session (rustup stable 1.98.1) and an isolation harness at /tmp/db-verify was built to work around the still-unavailable webkit2gtk/GTK deps the full Tauri crate needs. Baseline confirmed first: `cargo test` in the harness passed 16/16 (the pre-existing suite, including the two TASK-0009 regression tests already in this file) before any new adversarial work — output: 'test result: ok. 16 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.01s'."
      - "2026-09-04: Adversarial pass — six new #[test] functions added to database.rs's tests module, targeting the sharpest failure modes the fix claims to close, not just re-confirming the happy path: (1) test_update_tags_on_nonexistent_asset_leaves_no_orphan_tag — calls update_tags with an asset_id that was never inserted into `assets`, forcing the FK-constrained INSERT INTO asset_tags to fail, then directly queries `SELECT COUNT(*) FROM tags` before/after to prove the INSERT OR IGNORE INTO tags that ran earlier in the same loop iteration was rolled back with it rather than surviving as an orphan row — this is the test that actually distinguishes a real transaction from a cosmetic one. (2) test_update_tags_failed_call_leaves_all_tables_byte_identical — snapshots the full contents of tags, asset_tags, and assets.tags for a pre-existing asset, induces a failing call against a *different*, nonexistent asset_id, and asserts the snapshot is byte-for-byte unchanged, not just 'the asset list looks right' via the public read API. (3) test_update_tags_large_input — 1000 tags (500 unique values, each duplicated once) in a single call, confirms correct de-duplication to 500 persisted tags, correct ordering, correct join-queryability, and completion well under 5s. (4) test_update_tags_weird_strings — empty string, whitespace-only string, a SQL-metacharacter tag (`'; DROP TABLE assets; --`), and a Unicode/emoji tag (🐉龍ドラゴン) in one call; confirms params![] binding actually prevents injection (assets table still exists and is intact afterward) and that the Unicode tag round-trips correctly through search_assets. (5) test_delete_asset_on_nonexistent_id_is_silent_noop — confirms delete_asset on a never-inserted id returns Ok(()), and documents this as an intentional finding rather than assuming it's correct by default: idempotent 'make sure it's gone' semantics match the existing toggle_favorite/update_notes behavior on missing ids, and distinguishing 'deleted' from 'already gone' would need a Result<usize, _> signature change with call-site ripple effects, judged out of scope for this task. (6) test_update_tags_concurrent_file_backed_handles — the only in-memory-incapable scenario: two independent Database::open handles on the same file-backed, WAL-mode SQLite file (via tempfile::tempdir, added as a dev-dependency to the isolation harness to match the real crate's existing dev-dependency), confirming handle 2 sees handle 1's committed update_tags write, and handle 1 subsequently sees handle 2's replacement write (no stale-cache read across handles for this workload) — the real-world shape of two concurrent Tauri command invocations."
      - "2026-09-04: Result — all six adversarial tests passed on first run with no code changes needed; no bug was found in the TASK-0009 fix itself. The transaction wrapping is real (orphan-tag and byte-identical-snapshot tests both confirm full rollback, not partial), params![] binding is proven immune to the tested injection string, Unicode round-trips correctly, large batched input (1000 tags) completes correctly and fast, delete_asset's no-op-on-missing-id behavior is confirmed intentional-and-documented (not silently wrong), and WAL mode behaves sanely across two concurrent file-backed handles. Full harness output after adding the six tests: 'running 22 tests ... test result: ok. 22 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.09s'. Status moved to completed on the isolation-harness evidence gate above; the real crate's `cargo test` still needs to run in CI or on a developer machine with the GTK toolchain before this can be treated as CI-verified."

