  - id: TASK-0011
    title: "Fix PostProcessPanel's Resize tab: it never collects or sends a resize mode, so every Resize call is likely rejected by Meshy's API"
    status: pending
    risk_level: 1
    capability_tier: T1
    owner: unassigned
    created: "2026-09-04"
    updated: "2026-09-04"
    blocked_by: []
    evidence_gate: "Resize tab collects one of resizeHeight/resizeLongestSide/autoSize (mutually exclusive, per Meshy_Documentation/15-resize.md) plus optional originAt, via a mutually-exclusive-selection UI (see review note below — plain simultaneous inputs would be wrong); a frontend test asserts handleResize sends a body matching ResizeRequest with the selected mode, extending (not replacing) the existing objectContaining-based TC-POST-04-01 test; lint + tsc pass"
    adr_refs: []
    notes:
      - "2026-09-04: Found while verifying TASK-0006's now-abandoned premise. src/components/generate/PostProcessPanel.tsx:63-70 handleResize() sends only { inputTaskId } — none of resizeHeight/resizeLongestSide/autoSize. src/lib/meshy-types.ts:195-202 ResizeRequest already has all four fields typed (resizeHeight, resizeLongestSide, autoSize, originAt); Meshy_Documentation/15-resize.md:23 states 'Exactly one resize mode is required... mutually exclusive.' Every existing Resize click therefore either 400s or hits undocumented default behavior — not verified against a live API call, since that requires a real Meshy key, but the request body itself is provably incomplete against the documented required-parameter contract."
      - "2026-09-04: Classified Clarification, not ADR-worthy — this fits inside the already-accepted TaskProvider/ResizeRequest contract (ADR-0004), no new architecture, no schema/IPC-boundary shape change, just a missing UI input. T1."
      - "2026-09-04: REVIEWED (accuracy/staleness/dependencies/blast-radius pass, done directly rather than via a subagent — the Agent tool's safety classifier was unavailable/timing out after two retries; re-dispatch as a subagent later if strict subagent execution matters here). ACCURACY: confirmed exactly as stated, re-read PostProcessPanel.tsx:63-70 and meshy-types.ts:195-202 fresh, unchanged. STALENESS: not stale — `git log --oneline -5` on PostProcessPanel.tsx/meshy-types.ts/useMeshyApi.ts/api.rs shows nothing since 19e25ae (2026-08-26, predates this session), `git status` clean on all three. DEPENDENCIES — narrower than the original note implied: (1) meshy-types.ts needs no change, already fully typed. (2) src-tauri/src/commands/api.rs:337-342 create_resize takes body: serde_json::Value generically and forwards to create_task_inner(&state, &TaskType::Resize, &body) with no field-specific logic — the Rust/IPC side already passes through whatever the frontend sends, confirming this is a PURE FRONTEND fix, no IPC-boundary change, no GREB PR-05 both-sides concern. (3) PostProcessPanel.test.tsx:137-140's existing assertion uses expect.objectContaining({ inputTaskId: ... }) — a partial match, so it will NOT break when new fields are added; it should be EXTENDED with a new test asserting the selected resize-mode field is actually present, not treated as needing rewrite. (4) No other caller of ResizeRequest/useCreateResize/a resize control exists anywhere else in src/ (grepped broadly). (5) Side finding, not blocking: the existing Rust regression test resize_sends_snake_case_keys (api.rs:1471-1484) asserts generic camelCase-to-snake_case conversion using a field name (targetPolycount) that isn't even in ResizeRequest — looks copy-pasted from a Remesh test and doesn't actually validate resizeHeight/resizeLongestSide/autoSize round-tripping. Worth replacing with a resize-mode-specific assertion when this fix lands, as a stronger regression test than what exists today. BLAST RADIUS: LOWER than the risk_level might suggest at a glance — confirmed no IPC/schema/architecture change, T1/no-ADR classification HOLDS and is correct. One real design point for whoever implements it: a naive fix (three plain number inputs all shown at once) would misrepresent the API's mutually-exclusive constraint; src/components/ui/dropdown-menu.tsx already has Radix-style radio-item support usable as a precedent for a mode-select control, though a dedicated radio-group component doesn't exist yet in src/components/ui/ — worth a quick look at whether adding one or reusing dropdown-menu's radio items is the better fit before implementing, but this is an implementation detail, not a scope/classification change."

