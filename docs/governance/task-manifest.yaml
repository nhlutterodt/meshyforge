      - "2026-11-23: NPM RESULT (negative). license-checker --onlyAllow is string-based AND fail-fast: two runs over the same tree stopped on DIFFERENT packages (geist/OFL-1.1, then isexe/BlueOak-1.0.0). It can never enumerate offenders, so it cannot be the CI gate. Gate must be license-checker --json into an SPDX-aware evaluator (the concept-12 prototype). This CONTRADICTED concept-12 §4.1's claim that license-checker implements expression evaluation; concept-12 now carries a correction."
      - "2026-11-23: DEV-DEP CHECK. --exclude-dev gave identical counts (25 rejected / 0), proving none of the offenders is dev-only. Placement note recorded: --exclude-dev is a TOP-LEVEL arg and must precede 'check' (passing it after fails, exit 2)."
