    adr_refs: ["ADR-0011", "ADR-0002"]
    notes:
      - "2026-09-11: Escalated to T3 because it proposes widening the CSP img-src origin set, which ADR-0002 reserved to an ADR-gated decision. The proposal deliberately does NOT widen DOWNLOAD_HOSTS or validate_download_url."
      - "2026-09-11: DECISION CHANGED BY OWNER. The drafted Option B (render previews directly from cdn.meshy.ai) was rejected — a remote CDN must not be a primary runtime dependency, only a fallback. Option C adopted instead: previews cached locally and served from disk, CDN used only until the cache resolves or if caching fails."
      - "2026-09-11: The original SEC-10 rationale did NOT survive that change and was rewritten rather than quietly retained. Option C necessarily moves the fetch onto the privileged Rust client, so this decision adds MORE total surface than Option B (a fetch origin plus a fallback render origin, versus a render origin alone). Accepted deliberately; recorded explicitly in the ADR."
      - "2026-09-11: SEC-10 re-scoped to per-capability allowlists; SEC-12 added for sanitised cache filenames."

  - id: TASK-0030
    title: "Switch animation library to GET /v1/animations/library and surface preview/key/sub_category"
    status: completed
    risk_level: 2
    capability_tier: T2
    owner: claude-opus-5
    created: "2026-09-11"
    updated: "2026-09-11"
    blocked_by: ["TASK-0029"]
    evidence_gate: "animation_library_url no longer strips the /openapi prefix; Rust tests cover bare-array, wrapped-array and missing-key responses; AnimationLibraryItem carries key and previewUrl; the picker renders previews and stays fully operable when an image fails to load; cdn.meshy.ai appears in img-src and in no other CSP directive and is absent from DOWNLOAD_HOSTS"
    adr_refs: ["ADR-0011"]
    notes:
      - "2026-09-11: Current source is an undocumented internal endpoint reached by stripping /openapi (provider/meshy.rs:92-95). The public endpoint is credit-free and returns the complete list in one call."
      - "2026-09-11: Retain the Array.isArray guard in useAnimationLibrary.ts — it exists because of a prior full-app crash recorded in docs/LESSONS_LEARNED.md."
      - "2026-09-11: DONE. Endpoint switched to /v1/animations/library with no prefix stripping. Response handling accepts bare array AND the legacy wrapped object, so a shape change cannot black-screen the picker."
      - "2026-09-11: Response is now normalised in the command layer into AnimationLibraryEntry with a camelCase IPC contract and serde aliases for action_id / sub_category / preview_url. This structurally closes the snake_case-reaching-TypeScript defect class in LESSONS_LEARNED.md rather than relying on the frontend to remember."
      - "2026-09-11: Preview caching implemented local-first via cache_animation_preview (idempotent — an existing file is returned without refetch). Only the SELECTED action is cached; eagerly caching a ~500-entry catalogue was rejected as an unacceptable disk/network cost."
      - "2026-09-11: Security — PREVIEW_HOSTS is a separate allowlist from DOWNLOAD_HOSTS, exposed via a new allowed_preview_hosts() trait method. Tests assert cdn.meshy.ai is NOT in the download allowlist and that assets.meshy.ai is rejected for previews, so the two cannot silently merge in either direction. Cache filenames go through sanitize_cache_key (allowlist-only charset); a traversal key is rejected by test."
      - "2026-09-11: Gates green — biome 0 errors (139 files), tsc 0 errors, vitest 59 files / 424 tests, cargo test 241 passed, cargo clippy --all-targets -D warnings clean."

