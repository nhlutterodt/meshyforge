  - id: TASK-0042
    title: "Emit the rights record on export: give export_asset the asset identity, write the sidecar, and embed asset.copyright/asset.extras in GLB"
    status: completed
    risk_level: 3
    capability_tier: T2
    owner: cline-session-2026-11-23
    created: "2026-11-23"
    updated: "2026-11-23"
    blocked_by: ["TASK-0039", "TASK-0040"]
    evidence_gate: "export_asset accepts and validates an asset identity without weakening the data_dir/assets containment check, AND cross-checks that the identity resolves to a row whose file_paths CONTAINS the given path before writing anything (SEC-B); every export writes a schema_versioned sidecar; GLB exports round-trip through a loader test with asset.copyright and extras intact and the BIN chunk unchanged; a fixture GLB carrying a FOREIGN asset.extras key and an UNKNOWN extensions entry round-trips with both intact; a CC-BY-4.0 fixture produces the three-element credit from concept-11 s13.2; the THREE-OUTCOME DEGRADATION LADDER is implemented and tested (US-1) - full / copy+sidecar / copy+visible-warning - so a parser or DB failure can never block delivery of the user's file; GLB handling validates magic+version+declared length against ACTUAL length and caps the JSON chunk (US-2), never allocating from a declared length; the sidecar is a FIELD ALLOWLIST with no absolute paths, no signed URLs and no error_message (SEC-F); no whole-file buffering, two-pass streaming (P-1); and an INDEPENDENT security-boundary review PASSES before merge"
    adr_refs: ["ADR-0019", "ADR-0021"]
    notes:
      - "2026-11-23: WRITTEN UP AS ADR-0019 (Contract/Architecture) and ADR-0021 (Dependency), both accepted. ADR-0019 owns this task. Entry point for the new code: `export_asset_inner` (assets.rs), `get_export_source` (database.rs), `ExportRecord`/`parse_export_record`/`cc_by_credit` (models.rs)."
      - "2026-11-23: PART A SHIPPED - THE SIDECAR BASELINE (shape A). `export_asset` gained `asset_id` and now returns `Option<String>`: None = full record, Some(warning) = the copy succeeded but the record could not be produced. Files: ExportRecord + parse_export_record (reader REFUSES an unknown schemaVersion) + cc_by_credit (LM-03's three-element template, with the modification line) in models.rs; get_export_source in database.rs (one narrow read, no transaction held across IO); export_asset_inner + copy_export_file + row_owns_path + build_export_record + write_export_sidecar in assets.rs."
      - "2026-11-23: ND-10 CLOSED BY ORDERING, NOT BY STAGING. Copy first, sidecar second, sidecar committed atomically (.tmp sibling + rename in the destination's own directory). A crash leaves a file with NO record (re-exportable) rather than a record describing an unfinished file. The model copy stays a plain fs::copy: staging a 500MB copy would double peak disk use for no gain, because the hazard was always the sidecar lying."
      - "2026-11-23: SEC-B IMPLEMENTED AS A CROSS-CHECK, NOT AN ID LOOKUP. row_owns_path() canonicalises each absolute value in the row's file_paths and requires one to equal the canonical source path. Without this, adding an asset id would have become a way to export any file under the asset root while claiming it was a different asset. Tested directly: a row owning mine.glb refuses to export theirs.glb with INVALID_INPUT and copies nothing."
      - "2026-11-23: SIDECAR PATH DERIVED BY APPENDING, NEVER REPLACING. `out.glb` -> `out.glb.meta.json` (a .meta.json swap would collide across formats). The temp file is `out.glb.meta.json.tmp` - note `with_extension(\"tmp\")` from lib.rs's write_atomic would have produced `out.glb.meta.tmp`, which is why the pattern was reused rather than the function."
      - "2026-11-23: THREE TESTS FAILED AND ALL THREE WERE THE EXPECTED RIPPLE. (1) The 4 pre-existing export_asset_inner tests called the old 3-arg signature - rewritten onto make_state() and given real rows. (2) ipc_round_trip's export_asset harness test sent {path, destinationPath} with no assetId, so arg-decode failed before it could reach its INVALID_PATH assertion. (3) 3 ExportDialog assertions pinned the old 2-key mutate args. All fixed; 11/11 ExportDialog tests and 17/17 IPC tests pass."
      - "2026-11-23: notices:check CAUGHT THE DEPENDENCY CHANGE, as designed. Adding sha2+hex as direct dependencies made THIRD_PARTY_NOTICES.md stale; notices:write regenerated it (579 Rust + 435 npm, unchanged counts - the crates were already transitive, which is ADR-0021's whole point)."
      - "2026-11-23: VERIFIED. cargo test 389 lib + 17 IPC, 0 failed. vitest 67 files / 526 tests. tsc 0. biome 156 files clean. notices:check and layout:check green."
      - "2026-11-23: PART B REMAINED AT THE TIME OF THIS NOTE - GLB EMBEDDING (LM-04). Shape B is what ADR-0019 calls 'a projection of the sidecar': merge asset.copyright/extras into the GLB JSON chunk, NEVER replace it, preserve unknown keys and unknown extensions, validate magic+version+declared-length against actual length, cap the JSON chunk, and stream the BIN range (two-pass, never fs::read a whole GLB). The foreign-extras/unknown-extensions fixture is the gate."
      - "2026-11-23: PART B SHIPPED - and it is a module, not a patch. src-tauri/src/glb.rs owns the container: read_layout() walks the chunk table validating every length against the REAL file size (US-2: nothing allocates from a number a file claims about itself), parse_json(), and rewrite() which takes a mutator over serde_json::Value and returns Ok(false) when the mutator declines so nothing is written. It knows nothing about rights vocabulary - it takes bytes and a Value - which is what makes the format rules testable against synthetic fixtures."
      - "2026-11-23: SEVEN MODULE TESTS, INCLUDING THE LM-04 GATE. Foreign asset.extras key survives; unknown extensions entry survives; a provider's asset.copyright is UNTOUCHED; ours is namespaced under extras.meshyforge so it cannot collide; the BIN chunk comes back byte-identical; an unknown CHUNK TYPE is copied through; embedding is idempotent (embed twice = identical bytes); a declining transform writes no file; length mismatch / truncation / non-GLB are rejected; JSON is space-padded to 4 bytes and the declared total matches the bytes written."
      - "2026-11-23: P-1 PRESERVED BY CONSTRUCTION. read_layout records the BIN as a byte RANGE and never loads it; copy_range streams it through a fixed 64 KiB buffer and treats a short read as Truncated rather than silently delivering an incomplete file. One test builds a 1 MiB BIN and asserts the in-memory JSON is under 1 KiB."
      - "2026-11-23: INTEGRATION - DEGRADE, NEVER CORRUPT. export_asset_inner now rewrites a .glb destination from the source (skipping the copy) via a sibling .embed.tmp + rename. On Ok(false) or any GlbError it falls back to the byte-identical plain copy plus a warning, and the sidecar is still written. A container we cannot parse is never handed over half-merged. New test: a .glb whose content is not a GLB is delivered unchanged with 'without embedded metadata' and still gets its sidecar."
      - "2026-11-23: ONE PRE-EXISTING TEST CAUGHT THE BEHAVIOUR CHANGE CORRECTLY. export_asset_inner_copies_file_and_writes_the_sidecar wrote b'glb-bytes' into a .glb, so the new path declined to embed - the test now builds a real minimal GLB and asserts the destination was REWRITTEN with extras.meshyforge.rights.identifier = NOASSERTION and schemaVersion = 1 (exactly what Fact A=unknown must produce)."
      - "2026-11-23: ND-3 IS UNCHANGED AND STILL RIGHT. The baseline now records that embedding exists while the cut stands: ND-3 forbids RELYING on an embedded mark surviving, not writing one. The embedded record buys one hop - self-description at delivery - and the sidecar remains the durable carrier."
      - "2026-11-23: VERIFIED. cargo test 397 lib + 17 IPC = 414, 0 failed. vitest 67 files / 526 tests. tsc 0. biome 156 files clean. layout:check and notices:check green."
      - "2026-11-23: THE ORDERING TRAP. If a content hash is ever added it must be computed AFTER embedding, not from the stored file, or it describes a file that no longer exists. One-line bug, total loss of value; put it in the test list explicitly (concept-13 s6). The hash is currently a NAMED OMISSION: Cargo.toml has no sha2/blake3/hex, so it implies a new dependency and fails proportionality test 3 for a personal tool."
      - "2026-11-23: SEAM CONSTRAINT. export_asset_inner takes a path, not an id (assets.rs:269-282), and canonical_asset_path enforces that the path is rooted under data_dir/assets. Adding the asset id must not become a way to bypass that containment check - validate that the id resolves to a row whose file_paths contains the given path, rather than trusting the caller."
      - "2026-11-23: SEQUENCING INSIDE THE TASK. Land sidecar-first (concept-13 s4 shape A), then GLB embedding (shape B). A and B differ by one code path, and the sidecar schema must exist first so the embedded form is a projection of it rather than a second source of truth. 3MF and USDZ are out of scope until their carrier rows are verified (concept-13 s8)."
      - "2026-11-23: HARD REQUIREMENT ADDED - MERGE, NEVER REPLACE. This task rewrites the GLB JSON chunk, which is one careless line away from DELETING provenance instead of adding it. Three concrete failure modes: (a) serialising a fresh `asset` object instead of merging drops anything Meshy embedded; (b) a serde_json round-trip without order/unknown-field preservation can drop unknown keys and extensions; (c) if Meshy ever satisfies a provider-side marking duty (concept-14 s11 item 1 - Art. 50(2) was never retrieved verbatim) by embedding provenance, this export path becomes the thing that strips it. The app currently ships Meshy's bytes unmodified, so it currently PRESERVES whatever is embedded; adding our record must not regress that. Evidence gate now requires a foreign extras key and an unknown extensions entry to survive."
      - "2026-11-23: SECURITY REVIEW ROUND 1 - OWNER PROTECTION (OW-1/OW-2). The record must carry a `basis` block: the source name, the retrieval date, and an explicit statement that it is a SECONDARY source with the primary contract unretrieved (meshy.ai/terms-of-use returned HTTP 403). Reason: the realistic harm here is not a technical failure, it is a claim inside a client-facing file that reads like a legal conclusion. Separately, the UI must render NOASSERTION as 'not established' - never blank, never falling back to 'owned'. Data-layer honesty is undone by a presentation-layer default."
      - "2026-11-23: SECURITY REVIEW ROUND 1 - DECOUPLING (D-1/D-2/D-3/D-4). (a) The rights identifier is derived ONCE, in Rust, and exposed on the asset read model - the frontend renders it and never recomputes it, or the four-state mapping becomes a duplicated rule that drifts (LESSONS_LEARNED #2/#7 class). (b) The sidecar JSON and the IPC read model must be two serde projections of ONE Rust struct so the file format and the contract cannot diverge. (c) The sidecar NEVER travels through the frontend - the frontend must not assemble it. (d) DO NOT extract sidecar-writing into its own command: src/lib/tauri.ts:55-59 documents CommandName as a contract pinned by a guardrail test, and every new command widens the union and the permission review for zero benefit."
      - "2026-11-23: SECURITY REVIEW ROUND 1 - PERFORMANCE (P-1/P-2). Two-pass STREAMING only: read the header plus the JSON chunk, build the new JSON, then stream the source's BIN range into the output. Never fs::read the whole GLB - files run to hundreds of MB and the current fs::copy is O(1) memory, a property that must not be lost. If there is nothing to embed, take the pure-copy path rather than rewriting. Avoid writing the file twice."
      - "2026-11-23: SECURITY REVIEW ROUND 1 - NEW DB DEPENDENCY (P-3). Today export works with NO database access at all; taking an asset id introduces one. Read the record ONCE, up front, on a short-lived read, and never hold a transaction across file IO or a concurrent write blocks the export. This availability regression is precisely why the three-outcome degradation ladder exists: a DB failure must degrade the RECORD, never the delivery."
      - "2026-11-23: SECURITY REVIEW ROUND 1 - WRITE ATOMICITY (P-4). A crash can leave a sidecar describing an unfinished file, or a finished file with no record. Either implement staging+rename inside the destination directory (recovery.rs already uses this pattern; lib.rs:391 has a .tmp helper) or record the acceptance as ND-10 in docs/legal-metadata-baseline.md. Do not leave the trade-off unstated."
      - "2026-11-23: SECURITY REVIEW ROUND 1 - NEW WRITE SURFACE (SEC-A, US-3, US-4). The sidecar is the first write outside the sandbox: today the only writable area is $APPDATA/assets/** (assetProtocol scope, tauri.conf.json:30-32) and the sidecar goes to a user-chosen destination. Rules: derive the path by APPENDING A FIXED SUFFIX to the canonicalised destination - never by replacing the extension and never from a DB value; refuse if the target exists and is not a regular file; do not follow symlinks on create; stay inside the destination's own directory; do NOT add the destination to the asset-protocol scope (the OS delivers that file, not the WebView); do not clobber an unrelated existing <name>.meta.json (create-new semantics with an explicit, reported overwrite path); and handle Windows reserved device names (CON/PRN/AUX/NUL/COM1..) and MAX_PATH - a sidecar failure after a successful copy must degrade per the ladder, not fail the export."
      - "2026-11-23: UNBLOCKED - §6 answered, and ADR-0019 + ADR-0021 now own this task. Q1 = a SHA-256 prompt digest travels in the record (plaintext stays local); Q3 = ONE statement for the final asset, so the record carries no per-hop chain and LM-03's 'Modified from <parent task id>' line discharges the CC BY modification notice. Fact A='unknown' means the CC-BY branch is test-covered but dormant in production."
      - "2026-11-23: THE DIGEST IS CHEAPER THAN THE BASELINE ASSUMED, and ND-1's stated reason was wrong. ND-1 declined a content hash because 'no sha2/blake3/hex in Cargo.toml'. Those crates are ALREADY in Cargo.lock as transitive dependencies (sha2, hex, digest, ring, sha-1), so promoting sha2+hex adds ZERO crates to the built graph - no new code, licence surface, CVE surface or compile time. ADR-0021 authorises the two-line declaration. ND-1's DECISION still stands (post-export tampering barely exists here); only its stated reason is corrected."
      - "2026-11-23: HONESTY LIMIT ON THE DIGEST. A hash is not confidentiality - a short or guessable prompt can be confirmed by hashing candidates. It gives verifiability and avoids shipping the brief to the client; the UI and sidecar must not describe it as protecting a secret."
      - "2026-11-23: ORDERING TRAP REMAINS LIVE. If a content hash of the exported bytes is ever added (ND-1), it must be computed AFTER embedding, not from the stored file, or it describes a file that no longer exists. Still a named omission, not a task."

  - id: TASK-0043
    title: "Resolve the delete_asset / SECURITY.md contradiction: deleting an asset removes the DB row but leaves its files, while SECURITY.md:26 claims it removes them"
    status: completed
    risk_level: 2
    capability_tier: T1
    owner: cline-session-2026-11-23
    created: "2026-11-23"
    updated: "2026-11-23"
    blocked_by: ["TASK-0039"]
    evidence_gate: "Either delete_asset removes the asset's managed files with the same canonical_asset_path containment check the export path uses (plus a test proving a path outside data_dir/assets is refused), or SECURITY.md is corrected to describe the real behaviour; containment is enforced PER FILE AT DELETION TIME by canonicalising the path, never by trusting the stored JSON string, and directories and symlinks are refused (SEC-C); the UI enumerates what will be deleted before it happens (OW-3); the code and the document agree in one direction, the chosen direction is recorded, and an INDEPENDENT security-boundary review PASSES before merge"
    adr_refs: ["ADR-0020"]
    notes:
      - "2026-11-23: FOUND WHILE PLANNING, not while researching - which is the point of checking a premise before writing a question on it. docs/SECURITY.md:26 states 'Deleting an asset from MeshyForge removes its managed local files.' The implementation does not: useDeleteAsset.ts:13 invokes delete_asset with only {assetId}; delete_asset_inner (assets.rs:393-398) calls database.delete_asset, which runs 'DELETE FROM assets WHERE id = ?1' with asset_tags cascading. The only remove_file calls in the backend are client.rs:199 (download temp cleanup) and recovery.rs (recovery staging) - none tied to asset deletion."
      - "2026-11-23: WHY THIS MATTERS FOR LEGAL METADATA. The current behaviour is the WORST combination for provenance: the record is destroyed while the asset survives on disk, so a delivered or retained file is left with no record of what produced it. It is also the exact opposite of what SECURITY.md tells the user. Q2 (does deleting an asset delete its provenance?) could not be asked honestly until this was known - the answer 'delete the provenance too' would have described an operation that does not exist."
      - "2026-11-23: TWO DIRECTIONS, and the choice is a CONTRACT decision, not a doc edit. (A) Implement file removal: honours the SECURITY.md claim and the user guide, but makes deletion destructive and irreversible, and must reuse canonical_asset_path rather than trusting stored paths. (B) Correct SECURITY.md: less destructive, but leaves orphaned files accumulating and silently contradicts what users were told. This repo's rule is explicit - when code and a document disagree, report the discrepancy and change NEITHER silently - so the direction must be recorded, not assumed. Q2's answer at TASK-0039 constrains which."
      - "2026-11-23: A SECOND WITNESS, found while checking TASK-0044's blast radius. It is not one document against the code, it is TWO: docs/gap_assessment_documentation.md:371 records the original build step '| 4.5 | Create src/hooks/useDeleteAsset.ts | CSD §8.3 | Delete removes record + files |' and docs/SECURITY.md:26 says deleting an asset removes its managed local files. Both describe record+files; only delete_asset disagrees. This materially strengthens direction (A) - making the code match the security policy AND the original build plan - over direction (B), which would require weakening two documents to match an implementation that never did what its own plan specified."
      - "2026-11-23: DECIDED - direction (A), ADR-0020. Q2's answer is delete the record AND the managed files. delete_asset_inner gains per-file deletion behind containment, files FIRST then the row."
      - "2026-11-23: A THIRD WITNESS, and it points the other way. src-tauri/src/commands/assets.rs:194 carries a doc comment - 'Delete an asset record (and its tag links). Does not delete files on disk.' So the contradiction is not doc-vs-silent-code, it is 2 documents against 1 code comment. That comment must be rewritten whichever direction won, or the fix creates a fourth drift. It is the only place that currently states the truth."
      - "2026-11-23: THE ALGORITHM IS NOT 'CALL canonical_asset_path AND REMOVE'. That helper (assets.rs:64-79) REQUIRES the file to exist - canonicalize() fails on a missing path - so it cannot distinguish 'already deleted' from 'outside the root'. Treating both as an error makes a half-deleted asset permanently undeletable; treating both as success follows a poisoned path. ADR-0020 separates them structurally: symlink_metadata first, NotFound = already gone (tolerate), is_dir/is_symlink = refuse, else canonicalise and require starts_with(asset root) = refuse."
      - "2026-11-23: FILES FIRST, THEN THE ROW, because the two failures are not symmetric. A record without files is repairable (re-download, or delete again); files without a record is the exact provenance loss this task exists to prevent and is unrecoverable. Validation of ALL paths happens before ANY deletion, so a refusal aborts with the row intact and nothing removed."
      - "2026-11-23: SECURITY.md:26 needs NO CHANGE - it becomes true. The drift was in the code, not the policy."
      - "2026-11-23: IMPLEMENTED. delete_asset_inner now reads file_paths (new Database::get_asset_file_paths, which returns the RAW string so 'row absent' and 'JSON unparseable' stay distinguishable), resolves every managed file through managed_asset_files(), removes the files, then deletes the row. The doc comment at assets.rs:194 was rewritten - it was the third witness and the only accurate one."
      - "2026-11-23: DEVIATION FROM MY OWN ADR, recorded not hidden. ADR-0020 as drafted said 'row absent -> error'. Implemented as idempotent no-op success instead: a double-click or a stale card would otherwise raise a false failure toast for an operation that already reached the requested end state, and the existing DB test test_delete_asset_on_nonexistent_id_is_silent_noop already pinned that contract. ADR-0020 step 1 was amended with the reason."
      - "2026-11-23: UI CHANGED - the button was previously a ONE-CLICK IRREVERSIBLE DELETE with no confirmation at all. That was survivable when it only dropped a row; it is not survivable now that it destroys files. AssetDetail.tsx gained a Dialog that enumerates the managed files (role key + filename), explains irreversibility, and requires a second click on 'Delete permanently' (OW-3)."
      - "2026-11-23: TESTS. 5 new Rust tests in commands/assets.rs (removes managed files; refuses outside-root path AND keeps the row; refuses a directory target; tolerates already-deleted files; idempotent second delete). All 9 delete_asset* tests pass. New src/components/gallery/AssetDetail.test.tsx pins OW-3: the file list is enumerated and mutate is NOT called on the first click, only after the destructive confirmation."
      - "2026-11-23: FOUND DURING IMPLEMENTATION, worth knowing. DialogClose in this dependency version does not accept asChild (TS2322), so Cancel is a plain Button with onClick. Caught by tsc, not by reading the docs."
      - "2026-11-23: THE ALGORITHM WOULD HAVE BEEN WRONG IF I HAD TRUSTED THE GREP. An early search put canonical_asset_path inside delete_asset; reading the file showed line 215 belongs to reveal_in_file_manager. ground before editing."
      - "2026-11-23: SECURITY-BOUNDARY REVIEW EXECUTED (meshyforge-security-review, scope = the four changed files). 0 BLOCKING FINDINGS. Checked: VAL-04 (canonicalize before use; no '..' acceptance), VAL-06 (the new SQL is params![asset_id], no format!), SAN-01/SAN-04 (every new error string is generic - no path, no rusqlite detail; database_error logs and returns the generic message), RST-01/SAN-03 (grep for unwrap/expect/panic over the whole new region returned nothing), SEC-C (per-file symlink/dir refusal before any deletion), SEC-08 (no capability or CSP change - no new command, so no new permission)."
      - "2026-11-23: SEC REVIEW - 3 INFORMATIONAL, none requiring a change. (1) TOCTOU between symlink_metadata/canonicalize and remove_file: a swap could occur, but remove_file on Windows and Unix unlinks the link itself rather than the target, so worst case a link is removed, not an outside file - and this is a single-user local FS, the same class as the threat model's accepted residual risks. (2) AssetDetail renders the absolute path into a title attribute - but that path is ALREADY in the IPC read model the WebView holds, so it is a rendering of existing data, not new disclosure; SEC-F's 'no absolute paths' rule applies to the SIDECAR, not the local UI. (3) INVALID_PATH_MESSAGE reads 'The selected path is invalid or unavailable.' - inherited wording from the reveal path, slightly odd for deletion. UX nit only."
      - "2026-11-23: VERIFIED. vitest 66 files / 523 tests pass. cargo test 383 unit + 17 IPC round-trip, 0 failed. tsc --noEmit exit 0. biome 152 files clean. layout:check and notices:check pass. Ledger synced at 40 tasks."
      - "2026-11-23: THE GATE IS NOW LITERALLY TRUE, WHICH IS THE POINT. docs/SECURITY.md:26 ('Deleting an asset removes its managed local files') and gap_assessment:371 ('Delete removes record + files') described behaviour that did not exist for the life of the project. Both are now accurate, and the only document that had to change was a code comment."


  - id: TASK-0045
    title: "Wire the Rust licence gate: commit deny.toml and add a cargo-deny CI job, so DEP-06 finally has a check (ADR-0017)"
    status: completed
    risk_level: 1
    capability_tier: T1
    owner: cline-session-2026-11-23
    created: "2026-11-23"
    updated: "2026-11-23"
    blocked_by: []
    evidence_gate: "deny.toml is committed at the repo root and encodes ADR-0017's allowlist (MIT, Apache-2.0, ISC, BSD-2-Clause, BSD-3-Clause, Unicode-3.0, Apache-2.0 WITH LLVM-exception, Zlib, plus MPL-2.0 for exactly the five named tauri transitives); `cargo deny --manifest-path src-tauri/Cargo.toml --exclude-dev check licenses` exits 0 against the current graph AND exits non-zero with a stricter config; a `license-check` job runs it on every PR in ci.yml; and GREB §4.1 lists deny.toml so layout:check stays green"
    adr_refs: ["ADR-0017"]
    notes:
      - "2026-11-23: FILED BECAUSE THE GATE WAS NEVER OWNED. The inbound plane's OBLIGATIONS were discharged by TASK-0041 (notice bundle), but its PREVENTION control was not: deny.toml is ABSENT, no workflow runs any licence check (grep for 'deny' across .github/workflows/*.yml returns zero hits), and no task in this ledger owned it. All 37 task titles were checked before filing this. DEP-06 has therefore been a rule with no check since it was written - the exact defect class the legal-metadata baseline exists to prevent."
      - "2026-11-23: STARTS GREEN, deliberately. TASK-0038 proved a narrow config exits 0 against the current graph, so this gate does not arrive pre-broken. That is the opposite of the strict run (exit 4, 25 rejections) which would have been red on day one and disabled within a week."
      - "2026-11-23: WHY THE FAILURE MESSAGE MUST NAME THE FIVE CRATES. The allowance is per-crate, not a blanket 'MPL-2.0 is fine'. A future MPL-2.0 crate added directly MUST fail, and the person reading the failure needs to understand that the rule is bounded rather than broken - otherwise the rational response to a red gate is to widen the allowlist."
      - "2026-11-23: SCOPE DELIBERATELY EXCLUDES NPM. The npm half of DEP-06's check cannot start green: webgl-constants@1.1.1 declares no licence at all, which DEP-11 makes a FAILURE. Wiring it here would make the gate red on arrival. Split into TASK-0047 so this half can land and be trusted."
      - "2026-11-23: CI PLACEMENT. Belongs in ci.yml, NOT audit.yml - audit.yml is weekly-cron with every job continue-on-error, so a check placed there can never gate a PR. This is the same placement correction TASK-0041 had to make for notices:check."
      - "2026-11-23: EXECUTED. deny.toml committed at the repo root; license-check job in ci.yml using taiki-e/install-action pinned to cargo-deny@0.22.0 (the exact binary the policy was verified against); GREB §4.1 gained deny.toml so layout:check stays green."
      - "2026-11-23: THE GATE WAS RED ON ARRIVAL, AND THAT IS THE FINDING. ADR-0017 claimed the policy was 'verified this pass - exit 0 against the current graph' based on the TASK-0038 trial. The first real run exited 4 and rejected foldhash v0.2.0 (foldhash -> dom_query -> tauri-utils -> tauri) declaring Zlib. The trial's tally of 25 (18 Unicode-3.0 + 5 MPL-2.0 + 1 combined + 1 LLVM-exception) had no room for Zlib, so the graph MOVED between the trial and the gate. The ADR's 'verified' claim had already gone stale and only running the check revealed it. Zlib added (OSI-approved, FSF Free/Libre, permissive) and ADR-0017 amended with a dated note rather than silently widened."
      - "2026-11-23: LOCAL TOOLING. cargo-deny was NOT installed; installed 0.22.0 from crates.io (1m36s, --locked) so the config could be verified rather than asserted. The prebuilt GitHub asset URL 404'd - the crates.io path doubles as the version check."
      - "2026-11-23: NEGATIVE TEST, AND A FALSE PASS WORTH RECORDING. --config <temp> does NOT override the discovered deny.toml - it merges, so a stricter temp config still exited 0 while printing MPL-2.0 rejections. The honest test swapped deny.toml in place (removing the five exceptions), got licenses FAILED / exit 4, then restored it in a finally block and re-ran to confirm licenses ok / exit 0. A negative test that silently passes is worse than none."

  - id: TASK-0046
